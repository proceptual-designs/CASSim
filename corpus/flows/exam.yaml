# Exam-style flows: a student's whole session, key by key (M2 exit criterion; see tools/flows.py).
#
# Not simulator captures. The expected values are either taken from simulator-captured corpus cases
# (a step's `from` names the case) or worked by hand (`hand: true` on the flow, and the maths is
# in the step's `note`). What the flows add over the corpus is the device around the maths: typing
# through the keymaps, Ans, recall, undo, Ctrl+Enter, Problems and the keypad.
#
# `browser: true` flows use only typing and keys with the Methods defaults (Radian, Auto, Real), so
# the same script also runs in the built site (tests/e2e/test_flows_browser.py).
schema_version: 1
flows:
- id: methods-cubic-analysis
  course: methods
  browser: true
  hand: true
  title: Define a cubic, find its zeros, stationary points and an area
  steps:
  - {type: "f(x):=x^3{R}-6*x^2{R}+9*x", expect: Done}
  - {type: "solve(f(x)=0,x)", expect: x=0 or x=3, note: "x(x-3)^2"}
  - {type: "derivative(f(x),x)", expect: 3*x^2-12*x+9}
  - {type: "solve(derivative(f(x),x)=0,x)", expect: x=1 or x=3}
  - {type: "f(1)", expect: '4'}
  - {type: "fMax(f(x),x)|x<=2", expect: x=1, from: m9 fMax with a restricted domain}
  - {type: "integral(f(x),x,0,3)", expect: 27/4, note: "81/4 - 54 + 81/2"}
  - {type: "integral(f(x),x,0,3)", approx: true, expect: '6.75', compare: numeric}

- id: methods-ans-and-recall
  course: methods
  browser: true
  hand: true
  title: Work down a page with Ans, then bring an old line back and run it again
  steps:
  - {type: "5+7", expect: '12'}
  - {type: "*2", expect: '24', note: "an operator first on an empty line works on Ans"}
  - {type: "Ans-4", expect: '20'}
  - {keys: "Up Up Enter", entry: "Ans-4", note: "Up twice picks the entry; Enter brings it into the line"}
  - {keys: "Enter", expect: '16', note: "Ans is now 20 again, so Ans-4 is 16"}
  - {type: "Ans^2", expect: '256'}

- id: methods-distributions
  course: methods
  browser: true
  title: Normal and binomial probabilities, and an inverse normal
  steps:
  - {type: "normCdf(-1,1,0,1)", expect: '0.68268948', compare: numeric, from: corpus normCdf}
  - {type: "invNorm(0.975,0,1)", expect: '1.959964', compare: numeric, from: corpus invNorm}
  - {type: "invNorm(0.9,50,10)", expect: '62.815516', compare: numeric}
  - {type: "binomCdf(20,0.3,0,5)", expect: '0.41637082', compare: numeric}
  - {type: "binomCdf(10,0.5,3,5)", expect: '0.56835938', compare: numeric}

- id: methods-trig-and-exponentials
  course: methods
  browser: true
  title: A trig equation on a domain, exact values and a logarithm
  steps:
  - {type: "solve(2*sin(x)^2{R}-sin(x)-1=0,x)|0<=x<=2*pi",
     expect: x=π/2 or x=7*π/6 or x=11*π/6, from: m9.solve.trig-quadratic-domain}
  - {type: "sin(pi/6)", expect: 1/2}
  - {type: "cos(pi/3)", expect: 1/2}
  - {type: "ln(@e^3{R})", expect: '3'}
  - {type: "solve(2^x{R}=7,x)", expect: x=ln(7)/ln(2), hand: true}
  - {type: "pi/7", approx: true, expect: '0.44879895', compare: numeric, note: "Ctrl+Enter gives a decimal"}

- id: methods-stacked-fraction
  course: methods
  browser: true
  hand: true
  title: Build a sum of two stacked fractions with ctrl+/ and add them
  steps:
  - {type: "1", enter: false}
  - {keys: "ctrl+/", note: "the 1 becomes the numerator; the cursor is in the denominator"}
  - {type: "3{R}+1", enter: false}
  - {keys: "ctrl+/"}
  - {type: "4", enter: false, entry: "((1)/(3))+((1)/(4))"}
  - {keys: "Enter", expect: 7/12}

- id: methods-caps-lock
  course: methods
  title: Caps Lock, as the browser reports it (the key press, never the case)
  steps:
  - {type: "x:=3", expect: '3'}
  - {keys: "CapsLock"}
  - {keys: "X", entry: X, note: "Flutter reports the key X with no Shift: the lock makes it a capital"}
  - {keys: "Backspace CapsLock"}
  - {type: "x+1", expect: '4', note: "back to small letters"}

- id: methods-fix-a-typo
  course: methods
  title: Undo and Backspace in the entry line before running it
  steps:
  - {type: "12+3", enter: false, entry: "12+3"}
  - {keys: "ctrl+z", entry: "12+"}
  - {keys: "Backspace Backspace", entry: "1"}
  - {type: "+4", expect: '5', note: "1+4"}

- id: methods-problems-keep-their-own-variables
  course: methods
  title: Two Problems in one document do not share variables
  steps:
  - {type: "a:=5", expect: '5'}
  - {type: "b:=a*2", expect: '10'}
  - {action: add_problem}
  - {type: "a", expect: a, note: "an undefined variable echoes unchanged"}
  - {type: "a:=7", expect: '7', variable: {name: a, text: '7'}}
  - {variable: {problem: 1, name: a, text: '5'}}
  - {variable: {problem: 1, name: b, text: '10'}}

- id: specialist-complex-numbers
  course: specialist
  title: Quadratic with complex roots, powers, modulus and argument
  steps:
  - {type: "cSolve(x^2{R}+2*x+5=0,x)", expect: x=-1+2*ⅈ or x=-1-2*ⅈ, from: corpus cSolve}
  - {type: "(1+@i)^4", expect: '-4', hand: true, note: "((1+i)^2)^2 = (2i)^2"}
  - {type: "abs(3+4*@i)", expect: '5'}
  - {type: "angle(1+@i)", expect: π/4, from: corpus angle}
  - {type: "conj(2-3*@i)", expect: 2+3*ⅈ}
  - {type: "(2+@i)*(1-3*@i)", expect: 5-5*ⅈ, hand: true, note: "2-6i+i+3"}

- id: specialist-vectors-matrices-and-an-ode
  course: specialist
  title: Cross and dot products, a linear system, a determinant and a first order ODE
  steps:
  - {type: "crossP([1,2,3],[4,5,6])", expect: '[-3,6,-3]', from: corpus crossP}
  - {type: "dotP([1,2,3],[4,5,6])", expect: '32'}
  - {type: "simult([1,2;3,4],[5;6])", expect: '[-4;9/2]', from: corpus simult}
  - {type: "det([1,2;3,4])", expect: '-2'}
  - {type: "[1,2;3,4]*[5;6]", expect: '[17;39]'}
  - {type: "deSolve(y'=y and y(0)=2,x,y)", expect: y=2*ⅇ^x, from: corpus deSolve}

- id: general-finance
  course: general
  title: A loan repayment and a savings balance with the Finance functions
  steps:
  - {type: "tvmPmt(60,6,10000,0,12,12)", expect: '-193.32802', compare: numeric, from: corpus tvmPmt}
  - {type: "tvmFV(60,6,-200,0,12,12)", expect: '269.77003', compare: numeric, from: corpus tvmFV}
  - {type: "tvmFV(10,5,-5000,0,1,1)", expect: '8144.4731', compare: numeric}

- id: general-statistics-in-degrees
  course: general
  title: List statistics (the school quartile rule) and a trig value in degrees
  steps:
  - {type: "d:={1,4,9,16,25,36,49,64}", expect: '{1,4,9,16,25,36,49,64}'}
  - {type: "mean(d)", expect: '25.5', hand: true, note: "204/8"}
  - {type: "median(d)", expect: '20.5'}
  - {type: "OneVar d,1", expect: Done}
  - {type: "stat.q1x", expect: '6.5', note: "median of the lower half; numpy would say 7.75"}
  - {type: "stat.q3x", expect: '42.5'}
  - {type: "sin(30)", expect: '0.5', compare: numeric, note: "Degree mode"}

- id: handheld-keypad
  course: methods
  title: The on-screen keypad on its own, as on the handheld
  steps:
  - {keypad: "6 times 7 enter", expect: '42'}
  - {keypad: "1 ctrl div 3 enter", expect: 1/3, note: "ctrl then the divide key builds a fraction"}
  - {keypad: "ctrl square 4 9 enter", expect: '7', note: "ctrl x² is the square root template"}
  - {keypad: "( 2 plus 3 ) times 4 enter", expect: '20'}
