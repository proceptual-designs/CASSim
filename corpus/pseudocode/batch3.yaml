- id: proposed.collatz.peak-27
  tags: [while, if, mod, div, implicit-multiplication, long-trace]
  source: "Proposed by Claude: the classic n = 27 Collatz trajectory (111 steps, peak 9232)."
  third_party: false
  pseudocode: |
    n ← 27
    steps ← 0
    peak ← n
    while n ≠ 1 do
      if n MOD 2 = 0 then
        n ← n DIV 2
      else
        n ← 3n + 1
      end if
      if n > peak then
        peak ← n
      end if
      steps ← steps + 1
    end while
    print steps, peak
  python: |
    n = 27
    steps = 0
    peak = n
    while n != 1:
        if n % 2 == 0:
            n = n // 2
        else:
            n = 3*n + 1
        if n > peak:
            peak = n
        steps = steps + 1
    print(steps, peak)
  expect:
