- id: book.u2.sine-range-reduction
  tags: [function-keyword, end-function, if, mod, lists, for-each, sqrt, pi, horner, print-multiple]
  source: "S. Tyler, Algorithms and Mathematics: Methods Unit Two (Apr 2024), p.117 (own work): `sine` by range reduction and a 7th-degree Taylor polynomial in Horner form"
  third_party: false
  pseudocode: |
    function sine(angle)
      sign ← 1
      // reduce the domain to 1st quadrant
      x ← angle mod 2π
      if x > π then
        sign ← -1
        x ← x - π
      end if
      if x > π÷2 then
        x ← π - x
      end if
      // calculate the estimate of sine
      poly ← x*(1-x²/6*(1-x²/20*(1-x²/42)))
      return sign*poly // reconstruct
    end function

    angles ← [0, 18, 30, 45, 54, 60, 75, 90]
    for each angle in angles
      print angle, sine(angle×π÷180)
    end for
  python: |
    from math import pi

    def sine(angle):
        sign = 1
        # reduce the domain to 1st quadrant
        x = angle % (2*pi)  # [0, 2pi)
        if x > pi:
            sign = -1
            x = x - pi      # [0, pi)
        if x > pi/2:
            x = pi - x      # [0, pi/2)
        # calculate the estimate of sine
        x2 = x**2
        poly = x*(1-x2/6*(1-x2/20*(1-x2/42)))
        # reconstruct the function value
        return sign*poly

    angles = [0, 18, 30, 45, 54, 60, 75, 90]
    for angle in angles:
        print(angle, sine(angle*pi/180))
  expect:
    output: ["0 0", "18 0.309016994293", "30 0.499999991869", "45 0.707106469575", "54 0.80901539048", "60 0.866021271656", "75 0.965895210797", "90 0.999843101399"]
    compare: tokens-numeric
  trace:
    horizontal_eligible: false
  notes: "Decided 2026-11-07: pi is the built-in constant (`π`/`pi`) in both the pseudocode and the Python (a program may instead define pi as a decimal). The book's code shows pi = 355/113 inside `sine` (marked 'can use better approx.'), but its printed table is reproduced exactly by the true pi: sine values 0.30902, 0.50000, 0.70711, 0.80902, 0.86602, 0.96590, 0.99984 and errors -8.207229e-11, -8.130977e-09, -3.116114e-07, -1.603895e-06, -4.132128e-06, -3.061549e-05, -0.0001568986 for 18, 30, 45, 54, 60, 75, 90 degrees (computed from unrounded values they agree with the book to all its printed digits; the generator checks the printed 12-digit values to within 1e-12). So the 355/113 in the book's listing does not affect its printed output; it would shift the 18 degree error by orders of magnitude. `mod` is the infix operator on reals with floor semantics (x ← angle mod 2π). `x²` and `x²/6*(...)` follow the book's superscript spelling, which the dialect accepts. By Python precedence x²/6*(...) is ((x^2)/6)*(...), the same as the book."
