    define g1(x)
      return 1 + 1 ÷ x
    end

    define g2(x)
      return sqrt(1 + x)
    end

    define fixed_point(g, x0, tol)
      x ← x0
      n ← 0
      repeat
        old ← x
        x ← g(x)
        n ← n + 1
      until |x - old| < tol
      print n
      return x
    end

    print fixed_point(g1, 1, 1E-9)
    print fixed_point(g2, 1, 1E-9)
  python: |
    from math import sqrt

    def g1(x):
        return 1 + 1 / x

    def g2(x):
        return sqrt(1 + x)

    def fixed_point(g, x0, tol):
        x = x0
        n = 0
        while True:
            old = x
            x = g(x)
            n = n + 1
            if abs(x - old) < tol: break
        print(n)
        return x

    print(fixed_point(g1, 1, 1E-9))
    print(fixed_point(g2, 1, 1E-9))
  expect:
