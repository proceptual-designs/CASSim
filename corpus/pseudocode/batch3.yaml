- id: proposed.sort.bubble
  tags: [lists, for, nested, swap, if, for-each]
  source: "Proposed by Claude: bubble sort with a swap counter."
  third_party: false
  pseudocode: |
    a ← [5, 2, 9, 1, 7]
    n ← len(a)
    swaps ← 0
    for k from 1 to n - 1
      for i from 1 to n - k
        if a[i] > a[i + 1] then
          t ← a[i]
          a[i] ← a[i + 1]
          a[i + 1] ← t
          swaps ← swaps + 1
        end if
      end for
    end for
    for each x in a
      print x
    end for
    print "swaps", swaps
  python: |
    a = [5, 2, 9, 1, 7]
    n = len(a)
    swaps = 0
    for k in range(1, n):
        for i in range(n - k):
            if a[i] > a[i + 1]:
                a[i], a[i + 1] = a[i + 1], a[i]
                swaps = swaps + 1
    for x in a:
        print(x)
    print("swaps", swaps)
  expect:
    output: ["1", "2", "5", "7", "9", "swaps 5"]
    compare: tokens-numeric
  trace:
    horizontal_eligible: false
