    end for
  python: |
    def f(x):
        return 0.04*x**3 - 0.04*x**2 - x + 1

    def df(x):
        return 0.12*x**2 - 0.08*x - 1

    h = 0.5

    print("x", "forward_err", "central_err")
    for x in range(-5, 5+1):
        f_diff = (f(x+h) - f(x))/h
        c_diff = (f(x+h) - f(x-h))/(2*h)
        print(x, df(x) - f_diff, df(x) - c_diff)
  expect:
