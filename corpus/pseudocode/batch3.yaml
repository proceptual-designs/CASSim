        result = []
        for k in range(1, n+1):
            if n % k == 0:
                result.append(k)
        return result

    def evaluate(coeffs, x):
        total = 0
        for c in reversed(coeffs):
            total = total * x + c
        return total

    coeffs = [6, -11, -3, 2]
    for p in factors(6):
        for q in factors(2):
            if gcd(p, q) == 1:
