  source: "S. Tyler, Algorithms and Mathematics: Methods Unit Two (Apr 2024), p.118-121 (own work): newton3 example output (p.119) and newton_poly (p.121)"
  third_party: false
  pseudocode: |
    function evaluate_poly(coeffs, x)
      total ← 0
      for i from 1 to len(coeffs)
        term ← coeffs[i]*x^(i-1)
        total ← total + term
      next i
