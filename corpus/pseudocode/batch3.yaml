  third_party: false
  pseudocode: |
    define median(a, lo, hi)
      n ← hi - lo + 1
      mid ← lo + (n - 1) DIV 2
      if n MOD 2 = 1 then
        return a[mid]
      else
        return (a[mid] + a[mid + 1]) ÷ 2
      end if
    end

    define five_number(a)
      n ← len(a)
      half ← n DIV 2
      if n MOD 2 = 1 then
        upper_start ← half + 2
      else
        upper_start ← half + 1
      end if
      print a[1], median(a, 1, half), median(a, 1, n), median(a, upper_start, n), a[n]
    end

    five_number([1, 4, 9, 16, 25, 36, 49, 64])
    five_number([1, 3, 5, 7, 9, 11, 13])
  python: |
    def median(a, lo, hi):
        n = hi - lo + 1
        mid = lo + (n - 1) // 2
        if n % 2 == 1:
            return a[mid]
        else:
            return (a[mid] + a[mid + 1]) / 2

    def five_number(a):
        n = len(a)
        half = n // 2
        if n % 2 == 1:
            upper_start = half + 1
        else:
            upper_start = half
        print(a[0], median(a, 0, half - 1), median(a, 0, n - 1), median(a, upper_start, n - 1), a[-1])

    five_number([1, 4, 9, 16, 25, 36, 49, 64])
