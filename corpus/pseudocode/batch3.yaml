  third_party: false
  pseudocode: |
    f(x) ← 0.04x³ - 0.04x² - x + 1
    df(x) ← 0.12x² - 0.08x - 1
    h ← 0.5

    print "x", "forward_err", "central_err"
    for x from -5 to 5 step 1
      f_diff ← (f(x+h) - f(x)) ÷ h
