- id: author.simulation.consecutive-heads
  tags: [random, seed, for, while, nested, accumulator, print-multiple, sqrt, lists]
  source: "Adapted from the author's own code, Code Examples/Archive/2020-2024/Code Examples/Python 2016-2017/ConseqHeads.py (test_head_seq: tosses needed to get n heads in a row; mean and standard deviation of 100 trials)"
  third_party: false
  pseudocode: |
    seed(7)
    n ← 3
    trials ← 100
    results ← []
    for t from 1 to trials
      rolls ← 0
      heads ← 0
      while heads < n do
        rolls ← rolls + 1
        if randint(0, 1) = 1 then
          heads ← heads + 1
        else
          heads ← 0
        end if
      end while
      Append rolls to results
    end for
    total ← 0
    for each v in results
      total ← total + v
    end for
    m ← total ÷ trials
    ss ← 0
    for each v in results
      ss ← ss + (v - m)^2
    end for
    print "mean", m
    print "sd", sqrt(ss ÷ trials)
  python: |
    from math import sqrt
    from random import randint, seed

    seed(7)
    n = 3
    trials = 100
    results = []
    for t in range(1, trials+1):
        rolls = 0
        heads = 0
        while heads < n:
            rolls = rolls + 1
            if randint(0, 1) == 1:
                heads = heads + 1
            else:
                heads = 0
        results.append(rolls)
    total = 0
    for v in results:
        total = total + v
    m = total / trials
    ss = 0
    for v in results:
        ss = ss + (v - m)**2
    print("mean", m)
    print("sd", sqrt(ss / trials))
  expect:
    output: ["mean 15.45", "sd 11.9911425644"]
    compare: tokens-numeric
  trace:
    horizontal_eligible: false
  notes: "His simulation of 'tosses until n heads in a row', n = 3: theory says the mean is 2^(n+1) - 2 = 14 (and the standard deviation is about 12); the 100-trial estimate depends on the seed and is only checked to lie within the sample error. His mean and std helpers (`sum(values)/len(values)`, population standard deviation) are written as loops; his safety cap `max_rolls = 2**(2n)` is dropped (the loop ends with probability 1). Reproduces exactly only with CPython's seeded randint (MT19937). His other test, test_head_num, counts tosses to get n heads in total (any order): negative binomial with mean 2n."
  requires: [random, lists]
  provenance: {"source": "author-document-adapted", "extracted": "2026-11-06", "reference_python_run": true}
