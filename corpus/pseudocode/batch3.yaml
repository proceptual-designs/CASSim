- id: proposed.rational-roots.list
  tags: [lists, function, nested, gcd, rational, exact, if, specialist]
  source: "Proposed by Claude: Rational Root Theorem for 2x^3 - 3x^2 - 11x + 6 using lists. The author's version (in his sources, 'Rational Root Finder') uses sets: `A ← {factors of cn}` and `for each m ∈ A`: see requires."
  third_party: false
  pseudocode: |
    define gcd(a, b)
      while b ≠ 0 do
        r ← a MOD b
        a ← b
        b ← r
      end while
      return a
    end

    define factors(n)
      result ← []
      for k from 1 to n
        if n MOD k = 0 then
          Append k to result
        end if
      end for
      return result
    end

    define evaluate(coeffs, x)
      total ← 0
      for i from len(coeffs) to 1 step -1
        total ← total × x + coeffs[i]
      end for
      return total
    end

    coeffs ← [6, -11, -3, 2]
    for each p in factors(6)
      for each q in factors(2)
        if gcd(p, q) = 1 then
          for each sign in [1, -1]
            candidate ← sign × p ÷ q
            if evaluate(coeffs, candidate) = 0 then
              print candidate
            end if
          end for
        end if
