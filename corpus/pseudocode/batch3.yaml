  notes: "The author notes that false position often moves only one end of the bracket, so the width hi - lo cannot be the stopping test; this stops on |f(c)| < tol. Here the left end moves and hi stays at 2 (the curve is convex). The root is phi = 1.6180339887, accurate to about 1e-9 / f'(phi) = 3e-10. Expression form; twin: proposed.false-position.x2-x-1.fn."
