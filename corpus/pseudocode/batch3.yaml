- id: proposed.secant.x2-x-1
  tags: [repeat-until, abs-bars, return, expression-arg, root-finding]
  source: "Proposed by Claude, with the author's root-finding spreadsheet (f(x) = x^2 - x - 1, secant starting at 0 and 2; root phi = 1.618...)."
  third_party: false
  pseudocode: |
    define secant(f(x), x, x0, x1, tol)
      repeat
        x2 ← x1 - f(x1) × (x1 - x0) ÷ (f(x1) - f(x0))
        x0 ← x1
        x1 ← x2
      until |x1 - x0| < tol
      return x1
    end

    print secant(x^2-x-1, x, 0, 2, 1E-9)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def secant(f, x, x0, x1, tol):
        while True:
            x2 = x1 - f.subs(x, x1) * (x1 - x0) / (f.subs(x, x1) - f.subs(x, x0))
            x0 = x1
            x1 = x2
            if abs(x1 - x0) < tol: break
        return x1

    print(secant(x**2-x-1, x, 0, 2, 1E-9))
