- id: author.simulation.mean-of-uniforms
  tags: [random, seed, for, nested, accumulator, sqrt, print-multiple, slow, statistics]
  source: "Adapted from the author's own code, Code Examples/Archive/2020-2024/Code Examples/Python 2016-2017/Distribution of averages of uniform random numbers.py (the histogram is dropped; keeps the mean and spread of the 1000 averages)"
  third_party: false
  pseudocode: |
    seed(1)
    count ← 1000
    size ← 100
    sum_avg ← 0
    sum_sq ← 0
    for a from 1 to count
      total ← 0
      for i from 1 to size
        total ← total + rand()
      end for
      avg ← total ÷ size
      sum_avg ← sum_avg + avg
      sum_sq ← sum_sq + avg^2
    end for
    m ← sum_avg ÷ count
    sd ← sqrt(sum_sq ÷ count - m^2)
    print "mean", m
    print "sd", sd
  python: |
    from math import sqrt
    from random import random as rand, seed

    seed(1)
    count = 1000
    size = 100
    sum_avg = 0
    sum_sq = 0
    for a in range(1, count+1):
        total = 0
        for i in range(1, size+1):
            total = total + rand()
        avg = total / size
        sum_avg = sum_avg + avg
        sum_sq = sum_sq + avg**2
    m = sum_avg / count
    sd = sqrt(sum_sq / count - m**2)
    print("mean", m)
    print("sd", sd)
  expect:
    output: ["mean 0.50018362226", "sd 0.0299250974223"]
    compare: tokens-numeric
  trace:
    horizontal_eligible: false
  notes: "His investigation of the central limit theorem: average 100 uniform(0, 1) numbers, 1000 times, and plot the histogram (matplotlib there; the dialect has no plotting). Theory: each average has mean 1/2 and standard deviation sqrt(1/12)/sqrt(100) = 0.02887, and the averages are close to normally distributed. The sd is computed from the sums of squares (population form). 100000 calls of rand(): tagged `slow`; trace recording must be off or capped."
