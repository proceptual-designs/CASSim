- id: author.search.linear
  tags: [lists, for, return-in-loop, function, index-base]
  source: "Adapted from the author's own code, Code Examples/searching.py (linear_search); same algorithm, 1-based positions."
  third_party: false
  pseudocode: |
    define find(a, target)
      for i from 1 to len(a)
        if a[i] = target then
          return i
        end if
      end for
      return 0
    end

    data ← [4, 8, 15, 16, 23, 42]
    print find(data, 23)
    print find(data, 99)
  python: |
    def find(a, target):
        for position, x in enumerate(a, start=1):
            if x == target:
                return position
        return 0

    data = [4, 8, 15, 16, 23, 42]
    print(find(data, 23))
    print(find(data, 99))
  expect:
    output: ["5", "0"]
    compare: exact
  trace:
    horizontal_eligible: false
  notes: "The printed position (5) is the 1-based position. With the index-base toggle set to 0 the program as written would be wrong (`0` would then be a valid index, and `for i from 1` would skip the first element), so this case only runs with the default 1-based setting; a 0-based twin is a separate case if wanted. The Python returns the position counting from 1 (enumerate(a, start=1)) so that the output matches the pseudocode, whose positions are 1-based."
  requires: [lists]
  provenance: {"source": "author-document-adapted", "extracted": "2026-11-06", "reference_python_run": true}
  status: hand-verified
