    function deriv_poly(coeffs)
      deriv ← []
      for i from 2 to len(coeffs)
        append (i-1)*coeffs[i] to deriv
      next i
      return deriv
    end function

    function newton_poly(coeffs, x0, steps)
      p ← coeffs
      dp ← deriv_poly(coeffs)
      x ← x0
