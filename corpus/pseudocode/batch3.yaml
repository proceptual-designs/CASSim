- id: proposed.false-position.x2-x-1
  tags: [repeat-until, if-else, abs-bars, return, expression-arg, root-finding]
  source: "Proposed by Claude: method of false position (the 'chordal' method of the author's spreadsheet) on [0, 2] for f(x) = x^2 - x - 1."
  third_party: false
  pseudocode: |
    define false_position(f(x), x, lo, hi, tol)
      repeat
        c ← hi - f(hi) × (hi - lo) ÷ (f(hi) - f(lo))
        if f(c) × f(lo) < 0 then
          hi ← c
        else
          lo ← c
        end if
      until |f(c)| < tol
      return c
    end

    print false_position(x^2-x-1, x, 0, 2, 1E-9)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def false_position(f, x, lo, hi, tol):
        while True:
            c = hi - f.subs(x, hi) * (hi - lo) / (f.subs(x, hi) - f.subs(x, lo))
            if f.subs(x, c) * f.subs(x, lo) < 0:
                hi = c
            else:
                lo = c
            if abs(f.subs(x, c)) < tol: break
        return c

    print(false_position(x**2-x-1, x, 0, 2, 1E-9))
  expect:
