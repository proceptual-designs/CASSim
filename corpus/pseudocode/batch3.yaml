# Written 2026-11-06 in response to the corpus review (gaps: mod/div, lists, random, floor, break, complex, recursion; more numerical methods; Specialist items).
# Same schema as seed.yaml, plus two fields: `review: unreviewed` (Simon has not approved the case) and `requires: [...]` (dialect features the case needs that are Should/Could and not yet implemented: lists, random, tuples, complex, recursion, mod, div, break, floor, short-circuit, negative-step, nested-lists, rational).
# Expected output was produced by RUNNING the reference Python (floats to 12 significant figures, as in seed.yaml) and, where the author published a result (book LCG, dice tallies, sine table, Newton iterates, forward/central difference table, middle-square sequence) or a closed form exists, asserted equal to it by the generator. The pseudocode is NOT executed by anything yet (no interpreter until M7): it was translated by hand, so read it against the Python.
# ids: `book.*` follows the author's book/slides closely, `author.*` is the author's text adapted, `proposed.*` is Claude's. Approved cases are to be moved into seed.yaml with `review` removed.
schema_version: 0
cases:

- id: proposed.gcd.euclid-loop
  tags: [while, function, mod, integer]
  source: "Proposed by Claude: Euclid's algorithm (classic). gcd(1071, 462) = 21 is the standard worked example."
  third_party: false
  pseudocode: |
    define gcd(a, b)
      while b ≠ 0 do
        r ← a MOD b
        a ← b
        b ← r
      end while
      return a
    end

    print gcd(1071, 462)
    print gcd(17, 5)
    print gcd(0, 9)
  python: |
    def gcd(a, b):
        while b != 0:
            r = a % b
            a = b
            b = r
        return a

    print(gcd(1071, 462))
    print(gcd(17, 5))
    print(gcd(0, 9))
  expect:
    output: ["21", "1", "9"]
    compare: exact
  trace:
    horizontal_eligible: false
  notes: "First use of MOD in the corpus. Integers only, so identical in Approx, Auto and Exact. gcd(0, 9) checks that a zero first argument works (one pass swaps it). Same algorithm as the gcd in the author's rationals.py (`while b: a, b = b, a % b`, which his code misnames _lcm)."
  requires: [mod]
  provenance: {"source": "claude-proposed", "extracted": "2026-11-06", "reference_python_run": true}
  status: hand-verified
  review: approved



- id: proposed.lcm.from-gcd
  tags: [while, function, function-calls-function, mod, div]
  source: "Proposed by Claude: lcm(a, b) = a×b DIV gcd(a, b)."
  third_party: false
  pseudocode: |
    define gcd(a, b)
      while b ≠ 0 do
        r ← a MOD b
        a ← b
        b ← r
      end while
      return a
    end

    define lcm(a, b)
      return a × b DIV gcd(a, b)
    end

    print lcm(4, 6)
    print lcm(21, 6)
    print lcm(8, 9)
  python: |
    def gcd(a, b):
        while b != 0:
            r = a % b
            a = b
            b = r
        return a

    def lcm(a, b):
        return a * b // gcd(a, b)

    print(lcm(4, 6))
    print(lcm(21, 6))
    print(lcm(8, 9))
  expect:
    output: ["12", "42", "72"]
    compare: exact
  trace:
    horizontal_eligible: false
  notes: "Uses DIV. `a × b DIV gcd(a, b)` relies on × and DIV having the same precedence, left to right, as in Python (* and //): (a×b) DIV g. Decided 2026-11-07: operator precedence copies Python's (so MOD is the same level as × too). The author's own LCM (Code Examples/Python 2016-2017/LCM.py) steps two multiples instead; see author.lcm.search."
  requires: [mod, div]
  provenance: {"source": "claude-proposed", "extracted": "2026-11-06", "reference_python_run": true}
  status: hand-verified
  review: approved



- id: proposed.gcd.recursive
  tags: [recursion, function, if-else, mod]
  source: "Proposed by Claude: recursive Euclid."
  third_party: false
  pseudocode: |
    define gcd(a, b)
      if b = 0 then
        return a
      else
        return gcd(b, a MOD b)
      end if
    end

    print gcd(1071, 462)
    print gcd(48, 18)
  python: |
    def gcd(a, b):
        if b == 0:
            return a
        else:
            return gcd(b, a % b)

    print(gcd(1071, 462))
    print(gcd(48, 18))
  expect:
    output: ["21", "6"]
    compare: exact
  trace:
    horizontal_eligible: false
