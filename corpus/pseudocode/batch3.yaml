        while n > 0:
            digits.append(n % base)
            n = n // base
        return digits[::-1]

    def from_base(digits, base):
        total = 0
        for d in digits:
            total = total * base + d
        return total

    def symbols(digits):
        chars = "0123456789ABCDEF"
        return [chars[d] for d in digits]

    def convert(digits, old_base, new_base):
        print(old_base, "->", new_base, ":", symbols(to_base(from_base(digits, old_base), new_base)))

    convert([2, 5, 5], 10, 16)
    convert([1, 0, 0, 1, 0, 1], 2, 10)
    convert([1, 0, 0, 0], 10, 8)
    convert([15, 15], 16, 2)
    convert([1, 2, 3], 10, 16)
  expect:
    output: ["10 -> 16 : ['F', 'F']", "2 -> 10 : ['3', '7']", "10 -> 8 : ['1', '7', '5', '0']", "16 -> 2 : ['1', '1', '1', '1', '1', '1', '1', '1']", "10 -> 16 : ['7', 'B']"]
    compare: exact
  trace:
    horizontal_eligible: false
  notes: "His int2base takes remainders by divmod and reverses at the end; base2int adds the digit values times powers of the base (here Horner's rule, left to right). Reworked at the author's review (2026-11-07): each test prints `old_base -> new_base : digits`, and hexadecimal digits are shown with the letters A to F. The digits go in and out as lists of NUMBERS (15 for F), and the letters come from a list of one-letter string literals indexed by the digit value (chars[d + 1]): no string handling beyond printing a list of strings. A printed list shows its items as Python does, strings in single quotes: ['F', 'F'] (decision to confirm, dialect section 14). Checks: 255 = FF in base 16 (10 -> 16), 100101 in base 2 is 37, 1000 is 1750 in base 8, 11111111 is 255 and 123 is 7B. His negative-number handling and the base limit of 64 are dropped."
  requires: [lists, mod, div, negative-step, list-return, list-print, string-literals]
