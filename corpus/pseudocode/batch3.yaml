  notes: "For a cubic the central difference error is exactly h^2 f'''/6 = h^2: 12.25, 12.01, 12.0001. Matches the constant error seen in book.u2.derivative.forward-vs-central. Rounding makes the h = 0.01 value differ from 12.0001 by about 1e-12, so the tolerance is relaxed. Expression form; twin: proposed.derivative.central-difference.fn."
