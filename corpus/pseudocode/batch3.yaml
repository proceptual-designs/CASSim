- id: proposed.derivative.central-difference
  tags: [function, expression-arg, print-multiple, numerical-derivative]
  source: "Proposed by Claude: central difference as a function of h; f = x^3 at x = 2 (f'(2) = 12)."
  third_party: false
  pseudocode: |
    define central(f(x), x, a, h)
      return (f(a + h) - f(a - h)) ÷ (2*h)
    end

    print central(x^3, x, 2, 0.5)
    print central(x^3, x, 2, 0.1)
    print central(x^3, x, 2, 0.01)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def central(f, x, a, h):
        return (f.subs(x, a + h) - f.subs(x, a - h)) / (2*h)

    print(central(x**3, x, 2, 0.5))
    print(central(x**3, x, 2, 0.1))
    print(central(x**3, x, 2, 0.01))
  expect:
