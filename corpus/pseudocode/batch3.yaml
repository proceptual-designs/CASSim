- id: proposed.simpson.4-(x-1)^2
  tags: [for, if-else, mod, expression-arg]
  source: "Proposed by Claude: Simpson's rule on the author's trapezium example (author.trapezium.slides.4-(x-1)^2: f = 4 - (x-1)^2 on [0, 3], n = 6, trapezium gives 8.875)."
  third_party: false
  pseudocode: |
    define simpson(f(x), x, a, b, n)
      h ← (b - a) ÷ n
      total ← f(a) + f(b)
      for k from 1 to n-1
        if k MOD 2 = 1 then
          total ← total + 4×f(a + k×h)
        else
          total ← total + 2×f(a + k×h)
        end if
      next k
      return (h ÷ 3) × total
    end

    print simpson(4-(x-1)^2, x, 0, 3, 6)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def simpson(f, x, a, b, n):
        h = (b - a)/n
        total = f.subs(x, a) + f.subs(x, b)
        for k in range(1, n-1+1):
            if k % 2 == 1:
                total = total + 4*f.subs(x, a + k*h)
            else:
                total = total + 2*f.subs(x, a + k*h)
        return (h/3) * total

    print(simpson(4-(x-1)**2, x, 0, 3, 6))
  expect:
