- id: author.isbn.check-13
  tags: [lists, for, mod, accumulator, if-else, function, check-digit, print-in-function]
  source: "Adapted from the author's own code, Code Examples/Book Database/check_isbn.py (is_valid_isbn13; companion worksheet 'ISBN check digits - Algorithms and Worksheets.pdf')"
  third_party: false
  pseudocode: |
    define check_isbn13(d)
      total ← 0
      for i from 1 to 13
        if i MOD 2 = 1 then
          total ← total + d[i]
        else
          total ← total + 3 × d[i]
        end if
      end for
      if total MOD 10 = 0 then
        print "valid"
      else
        print "invalid"
      end if
    end

    // 978-3-16-148410-0
    check_isbn13([9, 7, 8, 3, 1, 6, 1, 4, 8, 4, 1, 0, 0])
    // 9783161484101 (last digit changed)
    check_isbn13([9, 7, 8, 3, 1, 6, 1, 4, 8, 4, 1, 0, 1])
  python: |
    def check_isbn13(d):
        total = 0
        for i, digit in enumerate(d):
            total = total + digit * (3 if i % 2 == 1 else 1)
        if total % 10 == 0:
            print("valid")
        else:
            print("invalid")

    check_isbn13([9, 7, 8, 3, 1, 6, 1, 4, 8, 4, 1, 0, 0])
    check_isbn13([9, 7, 8, 3, 1, 6, 1, 4, 8, 4, 1, 0, 1])
  expect:
    output: ["valid", "invalid"]
    compare: exact
  trace:
    horizontal_eligible: false
  notes: "ISBN-13 check, now one function that takes the list of 13 digits and prints valid or invalid (restructured at the author's review, 2026-11-07). Weights 1, 3, 1, 3, ... on the 13 digits (the last digit is the check digit); valid when the weighted sum is a multiple of 10. His code, with 0-based `enumerate(isbn)`, writes `3 if i % 2 else 1`, i.e. weight 3 for the odd 0-based index; with the 1-based loop in the pseudocode the weight 3 goes on the EVEN positions. His test pair: 978-3-16-148410-0 is valid (weighted sum 100) and 9783161484101 invalid (sum 101). The hyphens and `isdigit` checks of his string version are dropped: the digits arrive as a list of numbers."
  requires: [lists, mod]
