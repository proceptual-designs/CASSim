    define riemann(f(x), x, a, b, n)
      h ← (b - a) ÷ n
      area ← 0
      for k from 0 to n-1
        x ← a + k×h
        A ← h×f(x)
        area ← area + A
      next k
      return area
    end

    print riemann(x^2-x, x, 1, 5, 4)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def riemann(f, x, a, b, n):
        h = (b - a)/n
        area = 0
        for k in range(0, n-1+1):
            x_ = a + k*h
            A = h*f.subs(x, x_)
            area = area + A
        return area

    print(riemann(x**2-x, x, 1, 5, 4))
  expect:
