  source: "S. Tyler, Algorithms and Pseudocode - Practice Questions + Solutions (c) 2023-2024, docs.google.com/document/d/1ro2NG-D11AnFfhOD78CQ2LFhYrxwzfebSCPcDo0FB2Y"
  third_party: false
  pseudocode: |
    define f(x)
      return 2x-3
    end

    define bisection(f, L, R, P)
      repeat
        M ← (L + R) ÷ 2
        if f(M) = 0 then
          return M
        else if f(M)×f(L) < 0 then
          R ← M
        else
          L ← M
        end if
      until |R - L| ≤ P
      return (L+R)÷2
    end

    print bisection(f, 0, 2, 0.1)
  python: |
    def f(x):
        return 2*x-3

    def bisection(f, L, R, P):
        while True:
            M = (L + R)/2
            if f(M) == 0:
                return M
            elif f(M)*f(L) < 0:
                R = M
            else:
                L = M
            if abs(R - L) <= P: break
        return (L+R)/2

    print(bisection(f, 0, 2, 0.1))
  expect:
    output: ["1.5"]
    compare: numeric
  trace:
    horizontal_eligible: true
  notes: "Early return from inside the loop; |R - L| absolute-value bars. Author: [0,2] -> M=1 -> [1,2] -> M=1.5 returned. First-class form: the function is defined first and passed by name (no lambda). Expression twin: author.bisection.2x-3."
