  pseudocode: |
    function newton3(a, b, c, d, x0, steps)
      P(x)  ← ax³ + bx² + cx + d
      dP(x) ← 3ax² + 2bx + c

      x ← x0
      for i from 1 to steps do
        x ← x - P(x) ÷ dP(x)
