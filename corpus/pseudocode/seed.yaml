- id: author.linear.2x-3
  tags: [repeat-until, expression-arg, string, print-juxtaposed]
  source: "S. Tyler, Algorithms and Pseudocode - Practice Questions + Solutions (c) 2023-2024, docs.google.com/document/d/1ro2NG-D11AnFfhOD78CQ2LFhYrxwzfebSCPcDo0FB2Y"
  third_party: false
  pseudocode: |
    define linear(f(x), x, x0, h)
      x ← x0
      y ← f(x)
      repeat
        yold ← y
        x ← x + h
        y ← f(x)
      until yold × y ≤ 0
      print "zero between " x-h "and" x
    end

    linear(2x-3, x, 0, 0.4)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def linear(f, x, x0, h):
        x_ = x0
        y = f.subs(x, x_)
        while True:
            yold = y
            x_ = x_ + h
            y = f.subs(x, x_)
            if yold*y <= 0: break
        print("zero between", x_-h, "and", x_)

    linear(2*x-3, x, 0, 0.4)
  expect:
    output: ["zero between 1.2 and 1.6"]
    compare: tokens-numeric
    float_noise: true
  trace:
    horizontal_eligible: true
    loop_iterations: 4
  notes: "Needs: function-valued parameter written f(x); an expression in x passed as an argument; print with items juxtaposed (no commas) around string literals; float noise (x accumulates 0.4: 1.2000000000000002) so real display must round or compare numerically. Expression form (CAS style): the call passes an expression and the name of its variable. First-class twin: author.linear.2x-3.fn. Python: the variable symbol is the function's `x` argument and the local is `x_`."
  provenance: {"source": "author-document", "extracted": "2026-11-02", "reference_python_run": true}
  status: hand-verified





