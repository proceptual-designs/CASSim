  tags: [while, single-loop]
  source: "VCAA Mathematics Pseudocode page (study design support), questions (c) VCAA 2023; answers by S. Tyler (CC0), docs.google.com/document/d/17FAVXYfyTx4URTEFhv0O3pS4ehlJkBV2Z6sVGNTeO6Y"
