- id: vcaa.2023.q3.bisection-count
  tags: [while, function, if-else]
  source: "VCAA Mathematics Pseudocode page (study design support), questions (c) VCAA 2023; answers by S. Tyler (CC0), docs.google.com/document/d/17FAVXYfyTx4URTEFhv0O3pS4ehlJkBV2Z6sVGNTeO6Y"
  third_party: true
  pseudocode: |
    define f(x)
      return 2e^x − 17
    end

    a ← 2
    b ← 3
    c ← (a+b)/2
    count ← 0
    while b − a > 0.002 do
      count ← count + 1
      if f(a)×f(c) < 0 then
        b ← c
      else
        a ← c
      end if
      c ← (a+b)/2
      print count, c
    end while
  python: |
    def f(x):
        return 2*exp(x) - 17

    a = 2
    b = 3
    c = (a+b)/2
    count = 0
    while b - a > 0.002:
        count = count + 1
        if f(a)*f(c) < 0:
            b = c
        else:
            a = c
        c = (a+b)/2
        print(count, c)
  expect:
    output: ["1 2.25", "2 2.125", "3 2.1875", "4 2.15625", "5 2.140625", "6 2.1328125", "7 2.13671875", "8 2.138671875", "9 2.1396484375"]
    output_nth: {3: "3 2.1875"}
    compare: numeric
  trace:
    horizontal_eligible: true
  notes: "The VCAA program has no print; \"print count, c\" is added as the last line of the loop to expose the answer (c = 2.1875 when count = 3, end of the 3rd pass, per the author). Uses e^x with a Unicode minus."
  provenance: {"source": "author-document", "extracted": "2026-11-02", "reference_python_run": true}
  status: hand-verified





