- id: author.bisection.2x-3
  tags: [repeat-until, return, expression-arg, abs-bars]
  source: "S. Tyler, Algorithms and Pseudocode - Practice Questions + Solutions (c) 2023-2024, docs.google.com/document/d/1ro2NG-D11AnFfhOD78CQ2LFhYrxwzfebSCPcDo0FB2Y"
  third_party: false
  pseudocode: |
    define bisection(f(x), x, L, R, P)
      repeat
        M ← (L + R) ÷ 2
        if f(M) = 0 then
          return M
        else if f(M)×f(L) < 0 then
          R ← M
        else
          L ← M
        end if
      until |R - L| ≤ P
      return (L+R)÷2
    end

    print bisection(2x-3, x, 0, 2, 0.1)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def bisection(f, x, L, R, P):
        while True:
            M = (L + R)/2
            if f.subs(x, M) == 0:
                return M
            elif f.subs(x, M)*f.subs(x, L) < 0:
                R = M
            else:
                L = M
            if abs(R - L) <= P: break
        return (L+R)/2

    print(bisection(2*x-3, x, 0, 2, 0.1))
  expect:
    output: ["1.5"]
    compare: numeric
  trace:
    horizontal_eligible: true
  notes: "Early return from inside the loop; |R - L| absolute-value bars. Author: [0,2] -> M=1 -> [1,2] -> M=1.5 returned. Expression form (CAS style): the call passes an expression and the name of its variable. First-class twin: author.bisection.2x-3.fn. Python: the variable symbol is the function's `x` argument and the local is `x_`."
  provenance: {"source": "author-document", "extracted": "2026-11-02", "reference_python_run": true}
  status: hand-verified





