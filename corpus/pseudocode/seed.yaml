# Each case holds the pseudocode as the author writes it, a hand-written reference Python translation, and the expected output.
# Expected output was produced by RUNNING the reference Python (floats shown to 12 significant figures: these are reference values for numeric comparison, NOT the app's display, which defaults to 6 digits) and, where the author
