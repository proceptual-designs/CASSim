- id: author.newton.golden-ratio
  tags: [while, expression-arg, two-function-args]
  source: "S. Tyler, Algorithms and Pseudocode - Practice Questions + Solutions (c) 2023-2024, docs.google.com/document/d/1ro2NG-D11AnFfhOD78CQ2LFhYrxwzfebSCPcDo0FB2Y"
  third_party: false
  pseudocode: |
    define newton(f(x), Df(x), x, x0, ac)
      x ← x0
      y ← f(x)
      while |y| > ac do
        m ← Df(x)
        x ← x - y/m
        y ← f(x)
      end while
      return x
    end

    print newton(x^2-x-1, 2x-1, x, 2.0, 0.01)
  python: |
    from sympy import Symbol

    x = Symbol('x')

    def newton(f, Df, x, x0, ac):
        x_ = x0
        y = f.subs(x, x_)
        while abs(y) > ac:
            m = Df.subs(x, x_)
            x_ = x_ - y/m
            y = f.subs(x, x_)
        return x_

    print(newton(x**2-x-1, 2*x-1, x, 2.0, 0.01))
  expect:
    output: ["1.61904761905"]
    compare: numeric
    float_noise: true
  trace:
    horizontal_eligible: true
    loop_iterations: 2
  notes: "Author: two iterations give 34/21 = 1.619 (exact root 1.618...). ac = 0.01 chosen here so the loop stops after exactly two iterations. Exact-rational display (34/21) is a candidate for the rational type. Expression form (CAS style): the call passes an expression and the name of its variable. First-class twin: author.newton.golden-ratio.fn. Python: the variable symbol is the function's `x` argument and the local is `x_`."
