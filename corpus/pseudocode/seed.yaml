# syntax: optional built-in preset name (default, vcaa, author, strict) the case is parsed under; absent means default. The default does not split `ax` into a*x; the vcaa and author presets do (decision 0021).
# settings: every case runs with number=approx, angle=radian and display=full unless it has a `settings:` or `expect_by_settings:` block (SRS FR-SET-001..006). Replay compares the underlying printed values, so the 6-digit display default does not change a result; `display: 6` cases check the display itself.
