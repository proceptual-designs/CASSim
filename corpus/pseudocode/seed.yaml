- id: proposed.settings.exact-vs-approx.bisection
  tags: [settings, exact, rational, repeat-until, expression-arg]
  source: "Exact-mode variant of the author's bisection example. f(x) = x^3/3 + 2x + 4 is recovered from the author's worked values f(-2) = -8/3, f(-3/2) = -1/8, f(-1) = 5/3, f(-5/4) = 163/192 (slides, Bisection Method). Proposed by Claude."
  third_party: false
  pseudocode: |
    define bisection(f(x), x, L, R, P)
      repeat
        M ← (L + R) ÷ 2
        if f(M) = 0 then
          return M
        else if f(M)×f(L) < 0 then
          R ← M
        else
          L ← M
        end if
      until |R - L| ≤ P
      return (L+R)÷2
    end

    print bisection(x^3/3 + 2x + 4, x, -2, -1, 1/4)
  python: |
    from fractions import Fraction
    from sympy import Symbol

    x = Symbol('x')

    def bisection(f, x, L, R, P):
        while True:
            M = (L + R)/2
            if f.subs(x, M) == 0:
                return M
            elif f.subs(x, M)*f.subs(x, L) < 0:
                R = M
            else:
                L = M
            if abs(R - L) <= P: break
        return (L+R)/2

    print(bisection(x**3/3 + 2*x + 4, x, Fraction(-2), Fraction(-1), Fraction(1, 4)))   # Exact mode
  expect_by_settings:
    - {"settings": {"number": "exact"}, "output": ["-11/8"], "compare": "exact"}
    - {"settings": {"number": "auto"}, "output": ["-11/8"], "compare": "exact"}
    - {"settings": {"number": "approx"}, "output": ["-1.375"], "compare": "numeric"}
  trace:
    horizontal_eligible: true
    loop_iterations: 2
  notes: "In Auto and Exact modes integer / integer is a rational (no rounding anywhere, so f(M) = 0 tests are exact); in Approx mode it is a real. Same program, same trace layout; only the cell values differ (-3/2 vs -1.5). Python translation in Exact mode uses Fraction. Expression form (CAS style): the call passes an expression and the name of its variable. First-class twin: proposed.settings.exact-vs-approx.bisection.fn. Python: the variable symbol is the function's `x` argument and the local is `x_`."
  provenance: {"source": "claude-proposed", "extracted": "2026-11-02", "reference_python_run": true}
  status: hand-verified





