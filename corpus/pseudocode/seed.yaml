- id: vcaa.2023.sample.mm2.mcq6.bisection-sin
  tags: [define, while, if-else-if, return, function-param, max-iterations]
  source: "VCAA 2023 Sample MM Exam 2 MCQ 6 (c) VCAA, via S. Tyler's 2023 slides (docs.google.com/presentation/d/17teqp5_ryQYdwsip9TquacEEJYWDwDgzHctryatExmw) and practice booklet Bisection Q4 (which mislabels it MCQ 2)"
  third_party: true
  pseudocode: |
    Define bisection(f(x), a, b, max)
      If f(a) × f(b) > 0 Then
        Return "Invalid interval"
      i ← 0
      While i < max Do
        mid ← (a + b) ÷ 2
        If f(mid) = 0 Then
          Return mid
        Else If f(a) × f(mid) < 0 Then
          b ← mid
        Else
          a ← mid
        i ← i + 1
      EndWhile
      Return mid
    End

    print bisection(sin(x), 3, 5, 2)
  python: |
    from math import sin

    def bisection(f, a, b, mx):
        if f(a) * f(b) > 0:
            return "Invalid interval"
        i = 0
        while i < mx:
            mid = (a + b) / 2
            if f(mid) == 0:
                return mid
            elif f(a) * f(mid) < 0:
                b = mid
            else:
                a = mid
            i = i + 1
        return mid

    print(bisection(sin, 3, 5, 2))
  settings: {"number": "approx", "angle": "radian"}
  expect:
    output: ["3.5"]
    compare: numeric
  trace:
    horizontal_eligible: true
    loop_iterations: 2
  notes: "Answer D (3.5), verified by running; sin is radians. Real exam text: no `then`/`end` on the first If, `EndWhile` closer, the nested If bodies lack closers (indentation decides), and the while body mixes If/Else with a following line (i <- i+1) at the loop level. Exercises function-valued parameter f(x) and the Return-inside-loop. Confirmed from the slide: this is Sample Exam 2 MCQ6. The slide shows the author's version with the missing `End If` added and the note 'Missing in original code', so this case keeps the original text (no `End If` before `i ← i + 1`, the tolerant parser must close it). Must run in Radian mode (settings: angle radian). VCAA's function has no `end`; the corpus adds the missing `end` (decided 2026-11-04)."
