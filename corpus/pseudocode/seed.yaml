  python: |
    from math import sqrt, pi

    def f(x):
        return sqrt(x**2 + 1)

    total = 0
    left = 0
    while left <= 1:
        area = 2*pi*f((left + (left + 1))/2)*sqrt((f(left) - f(left + 1))**2 + 1)
        total = total + area
        left = left + 1
    print(total)
