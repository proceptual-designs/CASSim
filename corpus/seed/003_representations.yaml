# Representation changes (expand/factor/propFrac, exact<->approx, bases, angles, polar, string/expr, list<->matrix).
# Captured on the emulator 2026-10-31; transcribed by Claude, human review pending.
# Typed conversion arrows use ASCII @> (emulator keyboard); casoff.* cases run with CAS Mode = Off.
schema_version: 1
cases:
- id: repr.expand.cube
  course: methods
  tier: 1
  tags: [expand, representation]
  steps:
  - {in: expand((x+1)^3), out: x^3+3*x^2+3*x+1}
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software, CX II-T CAS handheld view (build not recorded: add from Help > About)', captured: '2026-10-31', reviewed_by: claude
      (screenshot transcription); human review pending, evidence: shots/repr.expand.cube.jpg}
  status: pending
- id: repr.propfrac.rational
  course: methods
  tier: 1
  tags: [propfrac, representation]
  steps:
  - {in: propFrac((x^2+1)/(x-1)), out: 2/(x-1)+x+1}
  - {in: propFrac(7/3), out: 2+1/3, compare: text}
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software, CX II-T CAS handheld view (build not recorded: add from Help > About)', captured: '2026-10-31', reviewed_by: claude
