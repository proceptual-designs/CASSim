    expect: [1, 3, 2, 1, 1]
    compare: list
  - {what: box plot minX, expect: 2, compare: numeric}
  - {what: box plot Q1, expect: 4, compare: numeric}
  - {what: box plot median, expect: 4.5, compare: numeric}
  - {what: box plot Q3, expect: 6, compare: numeric}
  - {what: box plot maxX, expect: 9, compare: numeric}
