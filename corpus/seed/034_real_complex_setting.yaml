- id: domain.polar.exponential-form
  course: none
  settings: {angle: radian, calc: auto, domain: polar, digits: float8}
  tier: 1
  tags: [domain, polar, complex]
  steps:
  - {in: 'sqrt(-1)', out: 'ⅇ^(ⅈ*π/2)'}
  - {in: 'sqrt(-4)', out: 'ⅇ^(ⅈ*π/2)*2'}
  - {in: '(-8)^(1/3)', out: 'ⅇ^(ⅈ*π/3)*2'}
  - {in: '(-8)^(2/3)', out: 'ⅇ^(2*ⅈ*π/3)*4'}
  - {in: 'ln(-1)', out: 'ⅇ^(ⅈ*π/2)*π'}
  - {in: '@i', out: 'ⅇ^(ⅈ*π/2)'}
  - {in: '3+4*@i', out: 'ⅇ^(ⅈ*(π/2-tan⁻¹(3/4)))*5'}
  - {in: '1/@i', out: 'ⅇ^(-ⅈ*π/2)'}
  - {in: '1+@i', out: 'ⅇ^(ⅈ*π/4)*√(2)'}
  - {in: '-1-@i', out: 'ⅇ^(-3*ⅈ*π/4)*√(2)'}
  - {in: 'conj(3+4*@i)', out: 'ⅇ^(ⅈ*(2*tan⁻¹(3/4)-π)/2)*5'}
  - {in: '-3', out: '-3'}
  - {in: 'cZeros(x^2+1,x)', out: '{ⅇ^(ⅈ*π/2),ⅇ^(-ⅈ*π/2)}'}
  - {in: '{1,sqrt(-1)}', out: '{1,ⅇ^(ⅈ*π/2)}'}
  provenance:
    source: simulator
    simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view'
    captured: '2026-11-08'
    reviewed_by: 'claude (Cowork screenshot transcription); human reviewed 2026-11-08 (Simon Tyler)'
    evidence:
    - ../docs/testing/domain-shots/D1-sqrt-neg-polar-a.png
    - ../docs/testing/domain-shots/D1-cuberoot-sqrtx-polar-a.png
    - ../docs/testing/domain-shots/D3-i-basic-polar-a.png
    - ../docs/testing/domain-shots/D3-imag-conj-angle-polar.png
    - ../docs/testing/domain-shots/D5-polar-inputs-polar-b.png
    - ../docs/testing/domain-shots/D4-cSolve-polar-b.png
    note: 'Polar writes ⅇ^(ⅈθ)·r (modulus last, omitted when 1), angle in radians; real numbers are unchanged. Polar with Angle=Degree uses (r∠θ), see domain.polar.degree-notation.'
  status: pass
- id: domain.solve-is-real-only
  course: none
  settings: {angle: radian, calc: auto, domain: real, digits: float8}
  tier: 1
  tags: [domain, solve, cSolve]
  steps:
  - {in: 'solve(x^2+1=0,x)', out: 'false'}
  - {in: 'solve(x^2=-4,x)', out: 'false'}
  - {in: 'cSolve(x^2+1=0,x)', out: 'x=ⅈ or x=-ⅈ'}
  - {in: 'factor(x^2+1)', out: 'x^2+1'}
  - {in: 'cFactor(x^2+1)', out: '(x-ⅈ)*(x+ⅈ)'}
  - {set: {domain: rectangular}}
  - {in: 'solve(x^2+1=0,x)', out: 'false'}
  - {in: 'cZeros(x^2+1,x)', out: '{ⅈ,-ⅈ}'}
  - {set: {domain: polar}}
  - {in: 'solve(x^2+1=0,x)', out: 'false'}
  provenance:
    source: simulator
    simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view'
    captured: '2026-11-08'
    reviewed_by: 'claude (Cowork screenshot transcription); human reviewed 2026-11-08 (Simon Tyler)'
    evidence:
    - ../docs/testing/domain-shots/D4-solve-cSolve-real-a.png
    - ../docs/testing/domain-shots/D4-solve-cSolve-rect-a.png
    - ../docs/testing/domain-shots/D4-solve-cSolve-polar-a.png
    - ../docs/testing/domain-shots/D4-zeros-factor-solve-rect-b.png
    note: 'solve never returns complex roots, even in Rectangular and Polar; the c* commands work in every setting.'
  status: pass
