  settings: {angle: radian, calc: auto, domain: real, digits: float8}
  tier: 1
  tags: [domain, real, roots, warning]
  steps:
  - {in: '(-8)^(1/3)', out: '-2'}
  - {in: 'root(-8,3)', out: '-2'}
  - {in: '(-8)^(2/3)', out: '4'}
  - {in: 'sqrt(-1)*sqrt(-1)', out: '-1', note: 'Device shows a warning triangle, Non-real calculation; no error.'}
  - {in: '(sqrt(-1))^2', out: '-1', note: 'Warning triangle on the device.'}
  - {in: 'real(3+4*sqrt(-1))', out: '3', note: 'Warning triangle on the device.'}
  - {in: 'imag(3+4*sqrt(-1))', out: '4', note: 'Warning triangle on the device.'}
  - {in: 'sqrt(x)', out: '√(x)'}
  - {in: 'sqrt(-x)', out: '√(-x)'}
  - {in: '@e^(@i*pi)', out: '-1'}
  - {in: 'ln(@i)', out: 'π/2*ⅈ'}
  - {in: 'sqrt(@i)', out: '√(2)/2+√(2)/2*ⅈ'}
  - {in: 'ln(0)', out: undef}
  provenance:
    source: simulator
    simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view'
    captured: '2026-11-08'
    reviewed_by: 'claude (Cowork screenshot transcription); human reviewed 2026-11-08 (Simon Tyler)'
    evidence:
    - ../docs/testing/domain-shots/D1-cuberoot-real.png
    - ../docs/testing/domain-shots/D1-sqrt-x-and-products-real.png
    - ../docs/testing/domain-shots/D1-sqrt-products-real-warning.png
    - ../docs/testing/domain-shots/D3-real-imag-sqrt-and-products-real.png
    - ../docs/testing/domain-shots/D3-real-imag-sqrt-real-warning.png
    - ../docs/testing/domain-shots/D2-eipi-ln0-lni-real.png
    - ../docs/testing/domain-shots/D7-solve-complex-sqrti-real.png
    note: 'The error needs a real-only function outside its domain AND a complex final value; a typed ⅈ never errors. The warning triangle (FR-CALC-007) is not yet drawn by CASSim.'
