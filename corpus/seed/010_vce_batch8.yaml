- id: m8.defs.define-tangent-fmax-restricted
  course: methods
  tier: 1
  tags: [define, tangentline, fmax, solve, vce]
  steps:
  - {in: Define h(x)=x^3-3*x, out: Done, compare: text}
  - {in: 'tangentLine(h(x),x,2)', out: 9*x-16}
  - {in: 'fMax(h(x),x)|x<=0', out: x=-1}
  - {in: 'solve(h(x)=0,x)', out: x=-√(3) or x=0 or x=√(3)}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude
      (screenshot transcription); human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/m8.defs.define-tangent-fmax-restricted-1.jpg, shots/m8.defs.define-tangent-fmax-restricted-2.jpg', note: 'Define is the keyword form
      of :=. fMax with a constraint (|x≤0) returns the local maximiser x=-1.'}
  status: pending
