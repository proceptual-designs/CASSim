# Batch 21: Degree with Auto, and Exp/Power/Cubic regressions in the Calculator.
schema_version: 1
cases:
- id: m15.settings.degree-auto-methods
  course: methods
  settings: {angle: degree, calc: auto, domain: real, digits: float8}
  tier: 1
  tags: [settings, angle, degree, auto]
  steps:
  - {in: sin(30), out: 1/2, compare: text}
  - {in: cos(45), out: √(2)/2, compare: text}
  - {in: tan(60), out: √(3), compare: text}
  - {in: arcsin(1/2), out: '30', compare: text}
  - {in: sin(1), out: sin(1), compare: text}
  - {in: sin(30.), out: '0.5', compare: numeric, tol: 1.0e-12}
  - {in: 'solve(sin(x)=1/2,x)|0<x and x<360', out: x=30 or x=150, compare: text}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/m15.settings.degree-auto-methods-1.jpg, shots/m15.settings.degree-auto-methods-2.jpg, shots/m15.settings.degree-auto-methods-3.jpg', note: 'Angle = Degree, Calculation
      Mode = Auto, Real, Float 8, Normal exponent format (status bar DEG). Special angles give exact values; sin(1) stays unevaluated in Auto because 1 degree has no exact form; a decimal argument gives
      0.5. arcsin returns a plain number (30). solve with the | constraint returns the two solutions in 0<x<360; writing the constraint inside solve with "and" returns a messy n1 parametric form instead,
      so use |.'}
  status: pending
- id: m15.stats.expreg-exact-data
  course: methods
  settings: &id001 {exp_format: scientific}
  tier: 1
  tags: [regression, exponential, calculator]
  steps:
  - {in: 'cx:={1,2,3,4,5,6}', out: '{1,2,3,4,5,6}', compare: canonical}
  - {in: 'cy:={2,4,8,16,32,64}', out: '{2,4,8,16,32,64}', compare: canonical}
  - {in: 'ExpReg cx,cy', out: Done, compare: text}
  - {in: stat.a, out: '1', compare: numeric, tol: 1.0e-09}
  - {in: stat.b, out: '2', compare: numeric, tol: 1.0e-09}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: shots/m15.stats.expreg-exact-data.jpg, note: 'ExpReg fits y=a*b^x; for y=2^x gives a=1, b=2 (shown as 1.ᴇ0 and 2.ᴇ0 because the document was in Scientific format).
      Typing "stat." in the Calculator opens an autocomplete list that swallows the next keystroke; retype it or pick from the list (stat.results lists everything).'}
  status: pending
- id: m15.stats.powerreg-exact-data
  course: methods
  settings: *id001
  tier: 1
  tags: [regression, power, calculator]
  steps:
  - {in: 'cx:={1,2,3,4,5,6}', out: '{1,2,3,4,5,6}', compare: canonical}
  - {in: 'cz:={1,8,27,64,125,216}', out: '{1,8,27,64,125,216}', compare: canonical}
  - {in: 'PowerReg cx,cz', out: Done, compare: text}
  - {in: stat.a, out: '1', compare: numeric, tol: 1.0e-09}
  - {in: stat.b, out: '3', compare: numeric, tol: 1.0e-09}
  - {in: stat.r², out: '1', compare: numeric, tol: 1.0e-09}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: shots/m15.stats.powerreg-exact-data.jpg, note: 'stat.results for PowerReg: Title "Power Regression", RegEqn "a*x^b", a=1, b=3, r²=1, r=1, then Resid and ResidTrans
      lists. Uses cx={1..6}.'}
  status: pending
- id: m15.stats.cubicreg-exact-data
  course: methods
  settings: *id001
  tier: 1
  tags: [regression, cubic, calculator]
  steps:
  - {in: 'cx:={1,2,3,4,5,6}', out: '{1,2,3,4,5,6}', compare: canonical}
  - {in: 'cw:={3,10,29,66,127,218}', out: '{3,10,29,66,127,218}', compare: canonical}
  - {in: 'CubicReg cx,cw', out: Done, compare: text}
  - {in: stat.a, out: '1', compare: numeric, tol: 1.0e-09}
  - {in: stat.b, out: '0', compare: numeric, tol: 1.0e-09}
  - {in: stat.c, out: '0', compare: numeric, tol: 1.0e-09}
  - {in: stat.d, out: '2', compare: numeric, tol: 1.0e-09}
  - {in: stat.R², out: '1', compare: numeric, tol: 1.0e-09}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: shots/m15.stats.cubicreg-exact-data.jpg, note: 'y=x^3+2 on x=1..6. stat.results shows a=1, d=2, R²=1, but b=16.ᴇ-12 and c=-49.ᴇ-12 (float noise), so b and c must be
      compared with a tolerance. CubicReg labels the fit "R²" while PowerReg labels it "r²" and "r".'}
  status: pending
