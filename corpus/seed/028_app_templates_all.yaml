      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/app.graphs.template-hyperbola-south-north-1.jpg, shots/app.graphs.template-hyperbola-south-north-2.jpg', note: 'Tab order is k, a, h, b, so typing 1,2,3,4 gives
      k=1, a=2, h=3, b=4. The branches open upward and downward.'}
