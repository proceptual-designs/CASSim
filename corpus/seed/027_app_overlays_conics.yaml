# Data & Statistics regression overlays, Graphs Equation Templates conics
schema_version: 1
cases: []
app_cases:
- id: app.stats.expreg-overlay
  app: data-statistics
  course: methods
  tags: [data-statistics, regression, exponential]
  setup: ['Calculator: cx:={1,2,3,4,5,6}, cy:={2,4,8,16,32,64}', 'Data & Statistics page; cx on x, cy on y', Menu > Analyze > Regression > Show Exponential]
  checks:
  - {what: overlay a, expect: 1, compare: numeric, tol: 1.0e-09}
  - {what: overlay b, expect: 2, compare: numeric, tol: 1.0e-09}
  - {what: overlay r², expect: 1, compare: numeric, tol: 1.0e-09}
  - {what: overlay label as shown, expect: y = 1.·(2.)^x, compare: text}
  provenance: {source: simulator, simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: shots/app.stats.expreg-overlay.jpg, note: 'Label reads y=1.·(2.)ˣ with r²=1. (Document in Degree mode, Float 8.) Regression submenu item 8 is Show Exponential. TODO (later milestone) - the regression equation label on the plot can be clicked and dragged to a new position so it is easier to read; do this for every regression overlay.'}
  status: pending
