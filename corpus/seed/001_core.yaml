# Seed corpus, batch 1. All 20 cases captured on the TI-Nspire CX CAS simulator on 2026-10-31.
# Transcription was done from screenshots by Claude; not yet human-reviewed (reviewed_by says so).
# status stays `pending` until the engine can run each case.
schema_version: 1
cases:

# ---------- Methods (Radian / Automatic / Real) ----------
- id: methods.solve.quadratic
  course: methods
  tier: 1
  tags: [solve]
  steps:
    - {in: "solve(x^2-4=0,x)", out: "x=-2 or x=2"}
  provenance: &emu
    source: simulator
    simulator_version: "TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view"
    captured: "2026-10-31"
    reviewed_by: "claude (screenshot transcription); human reviewed 2026-11-02 (Simon Tyler)"
    evidence: shots/methods.solve.quadratic.jpg
  status: pending

- id: methods.define.solve-with-domain
  course: methods
  tier: 1
  tags: [define, solve, constraint]
  steps:
    - {in: "f(x):=x^2-4", out: "Done"}
    - {in: "solve(f(x)=0,x)|x>0", out: "x=2"}
  provenance: {<<: *emu, evidence: shots/methods.define.solve-with-domain.jpg}
  status: pending

- id: methods.solve.system
  course: methods
  tier: 1
  tags: [solve, system]
  steps:
    - {in: "solve({x+y=3,x-y=1},{x,y})", out: "x=2 and y=1"}
  provenance: {<<: *emu, evidence: shots/methods.solve.system.jpg}
  status: pending

- id: methods.solve.trig-general-solution
  course: methods
  tier: 1
  tags: [solve, trig, arbitrary-constant]
  steps:
    - {in: "solve(sin(x)=1/2,x)", out: "x=2*@n1*π+π/6 or x=2*@n1*π+5*π/6", compare: family,
       note: "Confirmed on simulator: TI returns the general solution with n1 (shown bold italic). SymPy returns principal values only; the adapter must add the families."}
  provenance: {<<: *emu, evidence: shots/methods.solve.trig-general-solution.jpg}
  status: pending

- id: methods.algebra.factor-expand-propfrac
  course: methods
  tier: 1
  tags: [factor, expand, propFrac]
  steps:
    - {in: "factor(x^4-1)", out: "(x-1)*(x+1)*(x^2+1)"}
    - {in: "expand((x+1)^3)", out: "x^3+3*x^2+3*x+1"}
    - {in: "propFrac((x^2+1)/(x-1))", out: "2/(x-1)+x+1"}
  provenance: {<<: *emu, evidence: shots/methods.algebra.factor-expand-propfrac.jpg}
  status: pending

- id: methods.calculus.basic
  course: methods
  tier: 1
  tags: [derivative, integral, limit]
  steps:
    - {in: "derivative(x^2*sin(x),x)", out: "x^2*cos(x)+2*x*sin(x)"}
    - {in: "integral(x*exp(x),x,0,1)", out: "1", note: "Simulator displays exp(x) as e^x. Typing ASCII e on the simulator gives a variable, so exp() was used."}
    - {in: "limit(sin(x)/x,x,0)", out: "1"}
  provenance: {<<: *emu, evidence: shots/methods.calculus.basic.jpg, note: "The derivative entry is partly scrolled off the top of the screenshot; its result is visible."}
  status: pending

- id: methods.calculus.gradient-at-point-trap
  course: methods
  tier: 1
  tags: [derivative, define]
  steps:
    - {in: "f(x):=x^2", out: "Done"}
    - {in: "df(x):=derivative(f(x),x)", out: "Done"}
    - {in: "df(3)", out: "6"}
  provenance: {<<: *emu, evidence: shots/methods.calculus.gradient-at-point-trap.jpg}
  status: pending

- id: methods.syntax.d-paren-undefined-function
  course: methods
  tier: 2
  tags: [trap, syntax, undefined-function]
  steps:
    - {in: "d(x^2,x)", out: "d(x^2,x)",
       note: "NOT an error. d is an undefined function, so the call is returned unevaluated. The engine must treat unknown function names as symbolic function applications."}
  provenance: {<<: *emu, evidence: shots/methods.syntax.d-paren-undefined-function.jpg}
  status: pass

- id: methods.exact-vs-approx
  course: methods
  tier: 1
  tags: [mode, approx]
  steps:
    - {in: "47/10", out: "47/10"}
    - {in: "approx(47/10)", out: "4.7", compare: numeric, tol: 1.0e-9}
    - {in: "1./3", out: "0.33333333", compare: numeric, tol: 1.0e-7, note: "decimal point forces approximate"}
  provenance: {<<: *emu, evidence: shots/methods.exact-vs-approx.jpg}
  status: pass

- id: methods.angle.radian-exact
  course: methods
  tier: 1
  tags: [mode, trig]
  steps:
    - {in: "sin(pi/6)", out: "1/2", note: "Typing pi on the simulator yields π."}
  provenance: {<<: *emu, evidence: shots/methods.angle.radian-exact.jpg}
  status: pass

- id: methods.prob.distributions
  course: methods
  tier: 1
  tags: [prob, normal, binomial]
  steps:
    - {in: "normCdf(-1,1,0,1)", out: "0.68268948", compare: numeric, tol: 1.0e-7,
       note: "Simulator shows ...948; exact value is 0.682689492 (numerical integration, about 2e-8 relative error). Do not demand more than 1e-7."}
    - {in: "invNorm(0.975,0,1)", out: "1.959964", compare: numeric, tol: 1.0e-7}
    - {in: "binomPdf(10,0.5,5)", out: "0.24609375", compare: numeric, tol: 1.0e-9}
  provenance: {<<: *emu, evidence: shots/methods.prob.distributions.jpg, note: "Simulator entries were run in the order invNorm, binomPdf, normCdf."}
  status: pending

- id: methods.matrix.det
  course: methods
  tier: 1
  tags: [matrix]
  steps:
    - {in: "det([1,2;3,4])", out: "-2", note: "TI matrix syntax is [1,2;3,4] (semicolon separates rows)."}
  provenance: {<<: *emu, evidence: shots/methods.matrix.det.jpg}
  status: pending

# ---------- Specialist (Radian / Automatic / Rectangular) ----------
- id: specialist.complex.csolve
  course: specialist
  tier: 1
  tags: [complex, cSolve]
  steps:
    - {in: "cSolve(x^2+1=0,x)", out: "x=ⅈ or x=-ⅈ", note: "Simulator lists x=i first."}
    - {in: "abs(3+4*@i)", out: "5", note: "@i is the ASCII spelling of the imaginary unit ⅈ; the simulator echoes it as |3+4·ⅈ|. Confirmed in a later capture."}
    - {in: "abs(3+4*√(-1))", out: "5", note: "Alternative spelling: sqrt(-1) also gives the imaginary unit."}
  provenance: {<<: *emu, evidence: 'shots/specialist.complex.csolve.jpg, shots/specialist.complex.csolve-2.jpg'}
  status: pending

- id: specialist.vector.crossp
  course: specialist
  tier: 1
  tags: [vector]
  steps:
    - {in: "crossP([1,0,0],[0,1,0])", out: "[0,0,1]"}
  provenance: {<<: *emu, evidence: shots/specialist.vector.crossp.jpg}
  status: pending

