- id: general.stats.linreg-bx
  course: general
  tier: 1
  tags: [stats, regression]
  steps:
    - {in: "x:={1,2,3,4}", out: "{1,2,3,4}", compare: ignore, note: "setup; result scrolled off screen"}
    - {in: "y:={3,4,6,9}", out: "{3,4,6,9}", compare: ignore, note: "setup; result scrolled off screen"}
    - {in: "LinRegBx x,y,1:stat.results",
       out: '[["Title","Linear Regression (a+bx)"],["RegEqn","a+b*x"],["a",0.5],["b",2.],["r²",0.95238095],["r",0.97590007],["Resid","{...}"]]',
       compare: numeric, tol: 1.0e-7,
       note: "Resid is displayed as {...}; a follow-up case should check the residual list. Individual stat.a etc. not captured yet."}
  provenance: {<<: *emu, evidence: shots/general.stats.linreg-bx.jpg}
  status: pending

# ---------- Cross-cutting ----------
- id: scope.problems-are-isolated
  course: methods
  tier: 1
  tags: [scope, problem]
  steps:
    - {in: "5→a", out: "5"}
    - {in: "a+1", out: "6"}
    - {new_problem: true}
    - {in: "a", out: "a", note: "Undefined variable stays symbolic in a fresh Problem"}
  provenance: {<<: *emu, evidence: [shots/scope.problems-are-isolated-1.jpg, shots/scope.problems-are-isolated-2.jpg]}
  status: pending

