- id: app.graph.analyze-zero
  app: graphs
  course: methods
  tags: [graphs, analyze-graph, zero]
  setup: ['Add Graphs; f1(x)=x^3-3*x (default window -10..10, -6.67..6.67)', Menu > Analyze Graph > Zero, Click lower bound left of the zero (x about 1.2) then upper bound (x about 2.2)]
