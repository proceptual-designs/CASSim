- id: casoff.methods.calculus.basic
  course: methods
  settings: {cas_mode: 'off'}
  tier: 1
  tags: [derivative, integral, limit, cas-off]
  steps:
  - {in: 'derivative(x^2*sin(x),x)', error: true, error_contains: Use Derivative at a Point, note: 'Full dialog text: Use Derivative at a Point in CAS Off and Exact Arithmetic modes. After OK the entry stays in the history with the result text "Error: Use Derivative at a Point in CAS Off and Exact Arithmetic modes."'}
  - {in: 'derivative(x^2*sin(x),x)|x=2', out: '1.9726024', compare: numeric, tol: 1.0e-07, note: 'Derivative at a point works in CAS Off and gives a decimal (Radian mode): 2x sin x + x^2 cos x at x=2. The simulator shows it as d/dx(x^2·sin(x))|x=2.'}
  - {in: 'integral(x*exp(x),x,0,1)', out: '1', note: 'Simulator displays exp(x) as e^x. Typing ASCII e on the simulator gives a variable, so exp() was used.', compare: numeric}
  - {in: 'limit(sin(x)/x,x,0)', error: true, error_contains: CAS computations are restricted}
  provenance:
    source: simulator
    simulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view'
    captured: '2026-10-31'
    reviewed_by: claude (screenshot transcription); human reviewed 2026-11-02 (Simon Tyler)
