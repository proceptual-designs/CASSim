# Batch 14: Lists & Spreadsheet app (formula column, seq, Generate Sequence, OneVar, TwoVar, LinReg).
# app_cases: UI-level checks with screenshot evidence. Captured 2026-11-01 (6.0.3.374); transcribed by Claude, human reviewed 2026-11-02 (Simon Tyler).
schema_version: 1
cases: []
app_cases:
- id: app.sheet.formula-column
  app: spreadsheet
  course: methods
  tags: [spreadsheet, formula-column]
  setup: [Add Lists & Spreadsheet, 'Enter 2,4,4,4,5,5,7,9 in A1:A8', 'In the formula row of column B enter =a[]^2']
  checks:
  - what: B1:B8
    expect: [4, 16, 16, 16, 25, 25, 49, 81]
    compare: list
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/app.sheet.formula-column-1.jpg, shots/app.sheet.formula-column-2.jpg', note: 'Whole-column reference is written a[]. The formula cell for a named column is prefilled
      with "name:=" so typing "=" there produces "name:==". If column A is named d and the formula uses d the emulator shows a Conflict Detected dialog (d: Column or Variable?), so the capture references
      the column as a[].'}
  status: pending
