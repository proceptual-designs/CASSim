- id: app.sheet.generate-sequence-recursive
  app: spreadsheet
  course: methods
  tags: [spreadsheet, sequence, recursive, seqgen]
  setup: [Menu > Data > Generate Sequence, 'Formula u(n)=2*u(n-1)+1, Initial Terms 1, n0 1, nMax 6, nStep 1', Result goes into the selected column]
  checks:
  - what: first column, rows 1-6
    expect: [1, 3, 7, 15, 31, 63]
    compare: list
    note: Sixth term (63) read on screen in a later capture; row 7 stays empty because nMax is 6.
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/app.sheet.generate-sequence-recursive.jpg, shots/app.sheet.generate-sequence-recursive-2.jpg', note: 'The column formula becomes =seqgen(2·u(n-1)+1,n,u,{1,6},{1}...). A Data Loss dialog appears when the target
      column already holds data.'}
  status: pending
- id: app.sheet.one-variable-statistics
  app: spreadsheet
  course: methods
  tags: [spreadsheet, statistics, onevar]
  setup: ['A1:A8 = 2,4,4,4,5,5,7,9', 'Menu > Statistics > Stat Calculations > One-Variable Statistics, Num of Lists 1', 'X1 List a[], Frequency 1, 1st Result Column e[]']
  checks:
  - {what: mean x, expect: 5, compare: numeric}
  - {what: sum x, expect: 40, compare: numeric}
  - {what: sum x^2, expect: 232, compare: numeric}
  - {what: sx (sample sd), expect: 2.138089935, compare: numeric, tol: 1.0e-06}
  - {what: sigma x (population sd), expect: 2, compare: numeric}
  - {what: n, expect: 8, compare: numeric}
  - {what: MinX, expect: 2, compare: numeric}
  - {what: Q1X, expect: 4, compare: numeric}
  - {what: MedianX, expect: 4.5, compare: numeric}
  - {what: Q3X, expect: 6, compare: numeric}
  - {what: MaxX, expect: 9, compare: numeric}
  - {what: SSX, expect: 32, compare: numeric}
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/app.sheet.one-variable-statistics-1.jpg, shots/app.sheet.one-variable-statistics-2.jpg, shots/app.sheet.one-variable-statistics-3.jpg', note: 'Labels are in
