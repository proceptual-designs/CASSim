- id: m13.number.npr-lcm-ceiling-int-sign-fpart-round
  course: methods
  tier: 1
  tags: [number, npr, lcm, ceiling, int, sign, fpart, round]
  steps:
  - {in: 'nPr(6,2)', out: '30'}
  - {in: 'lcm(12,18)', out: '36'}
  - {in: ceiling(2.3), out: '3.', compare: numeric}
  - {in: int(-2.5), out: '-3.', compare: numeric}
  - {in: floor(-2.5), out: '-3.', compare: numeric, note: 'int and floor agree for negative numbers.'}
  - {in: int(2.5), out: '2.', compare: numeric}
  - {in: floor(2.5), out: '2.', compare: numeric}
  - {in: sign(-3), out: '-1'}
  - {in: fPart(7/3), out: 1/3}
  - {in: 'round(3.14159,2)', out: '3.14', compare: numeric}
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-11-01', reviewed_by: claude (screenshot transcription);
      human reviewed 2026-11-02 (Simon Tyler), evidence: 'shots/m13.number.npr-lcm-ceiling-int-sign-fpart-round-1.jpg, shots/m13.number.npr-lcm-ceiling-int-sign-fpart-round-2.jpg, shots/m13.number.npr-lcm-ceiling-int-sign-fpart-round-3.jpg', note: 'int is the floor function (verified: {int(-2.5),floor(-2.5),int(2.5),floor(2.5)} = {-3.,-3.,2.,2.}) (int(-2.5)
      = -3). ceiling and int return a decimal (3. and -3.) when given a decimal argument. fPart(7/3) keeps the exact fraction 1/3. The command is fPart, not frac.'}
  status: pending
