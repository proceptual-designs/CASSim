- id: repr.polar.to-rect
  course: specialist
  tier: 2
  tags: [rect, complex, representation]
  steps:
  - {in: 5*exp(sqrt(-1)*pi/3)@>Rect, out: 5/2+5*√(3)/2*ⅈ}
  provenance: {source: emulator, emulator_version: 'TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, CX II-T CAS handheld view', captured: '2026-10-31', reviewed_by: claude
      (screenshot transcription); human reviewed 2026-11-02 (Simon Tyler), evidence: shots/repr.polar.to-rect.jpg, note: Displayed as 5/2 + (5·√3/2)·ⅈ. Rectangular domain.}
  status: pending
