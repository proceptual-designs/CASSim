- id: c6r7.cas.integral-three-terms
  course: specialist
  settings: *spec
  tier: 2
  tags:
  - calculus
  steps:
  - in: integral(1/(x^3+x+2),x,0,2)
    out: 3*√(7)*tan⁻¹(3*√(7)/7)/28+3*√(7)*tan⁻¹(√(7)/7)/28+ln(9/2)/8
    compare: canonical
    note: The same three terms; TI puts the tan⁻¹(3√7/7) term first, CASSim second.
  provenance:
    <<: *prov
    evidence: ../docs/testing/pages-shots-7/R7-A3-integral-start.png, ../docs/testing/pages-shots-7/R7-A3-integral-end.png
  status: pass
- id: c6r7.cas.expand-with-and-without-variable
  course: specialist
  settings: *spec
  tier: 2
  tags:
  - algebra
  steps:
  - in: expand((x^2+a)/(b*x+c))
    out: a/(b*x+c)+c^2/(b^2*(b*x+c))+x/b-c/b^2
    compare: canonical
    note: TI shows the warning triangle here and not with the variable; its term order differs a
      little from CASSim's.
  - in: expand((x^2+a)/(b*x+c),x)
    out: (a*b^2+c^2)/(b^2*(b*x+c))+x/b-c/b^2
    compare: canonical
  provenance:
    <<: *prov
    evidence: ../docs/testing/pages-shots-7/R7-A4-expand.png
  status: pass
- id: c6r7.cas.trig-families-in-one-problem
  course: specialist
  settings: *spec
  tier: 2
  tags:
  - solve
  - trigonometry
  steps:
  - in: solve(cos(x)=0,x)
    out: x=(2*@n1-1)*π/2
    compare: text
  - in: solve(tan(x)=1,x)
    out: x=@n2*π+π/4
    compare: text
  - in: solve(sin(x)=1/2,x)
    out: x=2*@n3*π+π/6 or x=2*@n3*π+5*π/6
    compare: text
  - in: zeros(sin(x),x)
    out: '{@n4*π}'
    compare: text
  - in: fMax(sin(x),x)
    out: x=(4*@n5+1)*π/2
    compare: text
    note: No (-1)^n condition, unlike fMin(sin(x)+cos(x),x) in run 6.
  provenance:
    <<: *prov
    evidence: ../docs/testing/pages-shots-7/R7-A5-cos-tan.png, ../docs/testing/pages-shots-7/R7-A5-sin-zeros.png,
      ../docs/testing/pages-shots-7/R7-A5-fmax.png
  status: pass
