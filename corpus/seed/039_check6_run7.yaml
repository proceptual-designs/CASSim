# Emulator check 6 run 7: the Calculator rows of parts A and D (R7-A1 to R7-A10, R7-D1). Captured
# on the simulator 2026-11-27 by Claude Cowork; build 6.0.3.374, handheld page size, Radian, Auto,
# Rectangular, Float 8 unless a case says otherwise. Transcribed from
# docs/testing/emulator-calc8-results.md (in the evidence repository, decision 0039). Each case is
# one Problem, so the n and c counters start at 1. Warning triangles are checked in
# tests/unit/test_cas_run7.py, since a case cannot say whether a row has one. Human review pending.
schema_version: 1
cases:
- id: c6r7.cas.derivative-quotient
  course: specialist
  settings: &spec
    angle: radian
    calc: auto
    domain: rectangular
    digits: float8
  tier: 2
  tags:
  - calculus
  steps:
  - in: derivative((x+1)/(x-1),x)
    out: -2/(x-1)^2
    compare: text
    note: TI shows the warning triangle (domain of the result).
  provenance: &prov
    source: simulator
    simulator_version: TI-Nspire CX CAS Premium Teacher Software 6.0.3.374, handheld page size (emulator
      check 6, run 7)
    captured: '2026-11-27'
    reviewed_by: claude (transcribed from docs/testing/emulator-calc8-results.md); human review pending
    evidence: ../docs/testing/pages-shots-7/R7-A1-derivative-result.png
  status: pass
