# `uv run pre-commit install` sets up both hooks below. Commits run Ruff and Ty; pushes are
# refused unless the pushed commit's tree has passed `uv run python -m tools.local_ci`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: local-ci-passed
        name: local CI passed for the pushed commit
        entry: uv run python -m tools.local_ci --verify-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
