[project]
name = "flet-ping"
version = "0.1.0"
description = "FletPing control for Flet"

requires-python = ">=3.10"
authors = [
    { name = "Flet contributors", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.5",
]

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[project.urls]
Homepage = "https://mydomain.dev"
Documentation = "https://github.com/MyGithubAccount/flet-ping"
Repository = "https://github.com/MyGithubAccount/flet-ping"
Issues = "https://github.com/MyGithubAccount/flet-ping/issues"

[tool.setuptools.package-data]
"flutter.flet_ping" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
