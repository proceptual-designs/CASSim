# CASSim pseudocode syntax file: the built-in DEFAULT (draft schema v0, 2026-11-02).
#
# This is what the parser accepts and the printer writes. It is data, never code. In the app it is stored in browser storage,
# edited under the settings "..." menu > Syntax, and can be exported and imported (SRS FR-SYN-001 to -009).
# Format is a draft: SDD-13 may change it, but the ideas stay: several spellings per construct, each one
#   ok   = accepted silently
#   warn = accepted, with a warning beside the line
#   no   = rejected with a message
# and optional tokens (required | optional | forbidden). `emit` is what the printer writes.

syntax_version: 0
name: "CASSim default (tolerant)"
based_on: null

names:
  split_products: false                  # `ax` is the product a*x when a and x are defined: off here (an error with a hint), on in the vcaa and author presets

lexical:
  keywords_case_insensitive: true      # define / Define / DEFINE
  identifiers_case_sensitive: true     # A and a are different names
  comments:      {"//": ok, "#": ok}
  minus:         {"-": ok, "−": ok, "–": ok}
  times:         {"×": ok, "*": ok, "·": ok}     # implicit multiplication (2a, 2t) is always allowed
  divide:        {"÷": ok, "/": ok}
  mod:           {"mod": ok, "MOD": ok, "%": warn}     # x <- angle mod 2pi (floor semantics)
  div:           {"div": ok, "DIV": ok}
  sqrt_symbol:   {"√": ok}                 # √(x+1)
  power:         {"^": ok, "**": ok, superscript_digits: ok}
  equal:         {"=": ok, "==": ok}
  not_equal:     {"≠": ok, "<>": ok, "!=": ok}
  less_equal:    {"≤": ok, "<=": ok, "⩽": ok}
  greater_equal: {"≥": ok, ">=": ok, "⩾": ok}
  and:           {"and": ok, "∧": ok}
  or:            {"or": ok, "∨": ok}
  not:           {"not": ok, "¬": ok}
  grouping:      {"( )": ok}
  abs_bars:      ok
  string_quotes: {"straight": ok, "curly": ok}

symbols:                                 # ASCII <-> Unicode equivalents (SRS FR-SYN-011, FR-SYN-012); both always accepted, each ok | warn | no
  assign:        {ascii: ["<-", ":="], unicode: ["←"]}
  times:         {ascii: ["*"], unicode: ["×", "·"]}
  divide:        {ascii: ["/"], unicode: ["÷"]}
  less_equal:    {ascii: ["<="], unicode: ["≤", "⩽"]}
  greater_equal: {ascii: [">="], unicode: ["≥", "⩾"]}
  not_equal:     {ascii: ["!=", "<>"], unicode: ["≠"]}
  sqrt:          {ascii: ["sqrt("], unicode: ["√(", "√"]}
  euler:         {ascii: ["@e"], unicode: ["ⅇ"]}
  pi:            {ascii: ["pi", "@pi"], unicode: ["π"]}     # @pi is unambiguous; plain pi may be a name
  infinity:      {ascii: ["inf"], unicode: ["∞"]}
  abs:           {ascii: ["abs("], unicode: ["|x|"]}
  power:         {ascii: ["^", "**"], unicode: ["superscript integers"]}   # integer exponents only; x^(n+1) has no superscript form
  and_or_not:    {ascii: ["and", "or", "not"], unicode: ["∧", "∨", "¬"]}
  convert_button_default: unicode          # target of the Convert symbols button when the program is mixed

palette:                                 # shown by the symbol palette (FR-EDT-006); only symbols accepted above are listed
  groups:
    arithmetic: ["×", "÷", "±", "≤", "≥", "≠", "←", "≈"]
    powers_roots: ["²", "³", "ⁿ", "⁻¹", "√", "^", "π", "ⅇ", "∞"]
    logic: ["∧", "∨", "¬"]
    brackets: ["|x|", "( )", "[ ]"]
    greek: ["θ", "α", "β", "δ", "λ", "μ", "σ"]
  templates: [if, for, while, repeat, define]   # insert a block in the user's own syntax style

constructs:
  assign:
    spellings: {"←": ok, "<-": ok, ":=": ok, "=": warn}
  input:
    keywords: {input: ok}
  print:
    end: newline                             # newline | space | none: what print appends (decided: newline default, changeable in the ... menu; FR-SET-007)
    keywords: {print: ok, output: ok}
    parentheses: optional                    # print x, y   |   print(x, y)
    item_separator: {",": ok, juxtaposed_after_string_literal: warn}
  if:
    then: optional                           # required | optional | forbidden
    else_if: {"else if": ok, "elseif": ok, "elif": ok}
    terminators: {"end if": ok, "endif": ok, "end": no}
  while:
    do: optional
    is_true: ok                              # while c is true
    terminators: {"end while": ok, "endwhile": ok, "wend": ok, "end": no}
  for:
    range_words: {from: required, to: required, step: ok}
    do: optional
    terminators: {"end for": ok, "endfor": ok, "next": ok, "next <variable>": ok, "end": no}
  repeat_times:
    terminators: {"end repeat": ok, "endrepeat": ok, "next": no, "end": no}
  repeat_until:
    until: required                          # no separate terminator
  define:
    keywords: {define: ok, function: ok}
    colon_after_header: optional             # define f(x):
    terminators: {"end": ok, "end define": ok, "end function": ok, dedent: ok}
  function_by_assignment: ok               # P(x) <- a x^3 + b x^2 + c : defines a local function (book newton3)
  default_parameters: ok                   # define newton(f, x0, steps, h=10^-6)
  return: {keywords: {return: ok}}
  break:  {keywords: {break: ok}}

# Structure: a closer for an outer block (or a dedent) closes still-open inner blocks.
lists:
  index_base: 1                            # 1 | 0 ; also a toggle in the ... menu, saved with the program (decided)

structure:
  missing_inner_end: warn                  # ok | warn | no  (real exams omit EndIf/End If)
  surplus_end: no

# What the printer writes (translation from Python, formatting, examples).
emit:
  keyword_case: lower                        # lower | UPPER | Capitalised
  indent: 2
  comment: "//"
  assign: "←"
  times: "×"
  divide: "÷"
  if_then: always                            # always | never
  while_do: always
  for_do: never
  terminators: {if: "end if", while: "end while", for: "end for", repeat: "end repeat", define: "end"}
  print_parentheses: never
  symbols: unicode                       # unicode | ascii | keep: what the printer and Regularise write (FR-SYN-005, FR-SYN-012)
