<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain test review</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#667085;--line:#d9dde3;--ok:#1a7f4b;--bad:#c0392b;--unsure:#b7791f;--acc:#2f5bd6}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2127;--ink:#e8eaed;--mut:#9aa3af;--line:#343a43;--ok:#4cc38a;--bad:#ff7b6b;--unsure:#e5b94e;--acc:#7da2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
.prog{color:var(--mut)}
main{max-width:1500px;margin:0 auto;padding:16px}
.part{margin:24px 0 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 16px;padding:14px;border-left:5px solid var(--line)}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:var(--bad)}.card.unsure{border-left-color:var(--unsure)}
.card.cur{outline:2px solid var(--acc)}
.card h3{margin:0 0 4px;font-size:15px}
.inputs{font-family:ui-monospace,Consolas,monospace;color:var(--mut);margin-bottom:10px;word-break:break-word}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.modes{grid-template-columns:1fr}}
.mode h4{margin:0 0 6px;font-size:13px}
.claim{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0 0 8px;font-size:13px;white-space:pre-wrap}
.claim b{color:var(--mut);font-weight:600}
.mode img{width:100%;display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:zoom-in;background:#fff}
.cap{font-size:11px;color:var(--mut);margin:-2px 0 6px;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row .st button.on.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.row .st button.on.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.row .st button.on.unsure{background:var(--unsure);color:#fff;border-color:var(--unsure)}
textarea{flex:1;min-width:200px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;min-height:34px;resize:vertical}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh;image-rendering:auto;background:#fff}
#zoom.on{display:flex}
.hint{color:var(--mut);font-size:12px}
.missing{color:var(--bad);font-size:12px}
</style></head><body>
<header>
 <h1>Domain test review</h1>
 <span class="prog" id="prog"></span>
 <select id="filter"><option value="all">All groups</option><option value="todo">Not yet reviewed</option><option value="bad">Wrong</option><option value="unsure">Unsure</option><option value="ok">OK</option></select>
 <button id="exp">Copy flags as Markdown</button>
 <button id="dl">Download JSON</button>
 <button id="reset">Clear all marks</button>
 <span class="hint">Keys: j/k next/prev · 1 OK · 2 Wrong · 3 Unsure · click image to zoom · Esc closes</span>
</header>
<main id="main"></main>
<div id="zoom"><img alt=""></div>
<script>
const D='domain-shots/';
// claims = what emulator-domain-results.md says; check each against the screenshot.
const G=[
{p:'Part 1 · square roots and powers',t:'√ of negatives, (-4)^(1/2), (-1)^(1/2)',in:'sqrt(-1), sqrt(-4), sqrt(-8), (-4)^(1/2), (-1)^(1/2)',
 real:['D1-sqrt-neg-real','D1-pow-half-real','D1-sqrt-neg-real-dialog'],rect:['D1-sqrt-neg-rect'],polar:['D1-sqrt-neg-polar-a','D1-sqrt-neg-polar-b'],
 c:{real:'All five: "Error: Non-real result" + dialog',rect:'i; 2i; 2√2 i; 2i; i',polar:'e^(iπ/2); e^(iπ/2)·2; e^(iπ/2)·2·√2; e^(iπ/2)·2; e^(iπ/2)'}},
{p:'Part 1 · square roots and powers',t:'Cube roots, 2/3 power, √x, √-x',in:'(-8)^(1/3), root(-8,3), (-8)^(2/3), sqrt(x), sqrt(-x)',
 real:['D1-cuberoot-real'],rect:['D1-cuberoot-sqrtx-rect-a','D1-cuberoot-sqrtx-rect-b'],polar:['D1-cuberoot-sqrtx-polar-a','D1-cuberoot-sqrtx-polar-b'],
 c:{real:'-2; -2; 4; (√x and √-x on the next group\'s shot)',rect:'1+√3 i; 1+√3 i; -2+2√3 i; √x; √-x',polar:'e^(iπ/3)·2; e^(iπ/3)·2; e^(2iπ/3)·4; √x; √-x'}},
{p:'Part 1 · square roots and powers',t:'√x, √-x, products with √(-1)',in:'sqrt(x), sqrt(-x), sqrt(-1)*sqrt(-1), (sqrt(-1))^2',
 real:['D1-sqrt-x-and-products-real','D1-sqrt-products-real-warning'],rect:['D1-sqrt-products-and-log-rect-a'],polar:['D1-products-ln-polar-a'],
 c:{real:'√x; √-x; ⚠ -1; ⚠ -1. Triangle text: "Non-real calculation"',rect:'-1; -1 (no triangle)',polar:'-1; -1 (no triangle)'}},
{p:'Part 2 · logs and inverse functions',t:'ln and log of negatives',in:'ln(-1), ln(-2), log(-1), log(-100,10)',
 real:['D2-log-neg-real'],rect:['D2-log-neg-rect'],polar:['D1-products-ln-polar-a','D2-log-polar-b'],
 c:{real:'All four: Error: Non-real result',rect:'πi; ln(2)+πi; π·log10(e)·i; 2+π·log10(e)·i',polar:'ln(-1)=e^(iπ/2)·π; ln(-2)=e^(i·tan⁻¹(π/ln2))·√((ln2)²+π²); log results cut off at right edge'}},
{p:'Part 2 · logs and inverse functions',t:'arcsin/arccos/arccosh/arctanh out of range',in:'arcsin(2), arccos(2), arccosh(0), arctanh(2), arcsin(-2)',
 real:['D2-arc-out-of-range-real'],rect:['D2-arcsin-arccos-2-rect','D2-arccosh-arctanh-arcsin-neg2-rect'],polar:['D2-arcsin-arccos-2-polar','D2-arccosh-arctanh-polar','D2-arcsin-neg2-polar'],
 c:{real:'All five: Error: Non-real result',rect:'π/2 − (ln(4√3+7)/2)i; (ln(4√3+7)/2)i; π/2·i; ln3/2 − π/2·i; −π/2 + (ln(4√3+7)/2)i',polar:'e^(…)·… forms; arcsin(2) and arcsin(-2) cut off at right edge'}},
{p:'Part 2 · logs and inverse functions',t:'e^(iπ), ln(0), ln(i)',in:'@e^(@i*π), ln(0), ln(@i)',
 real:['D2-eipi-ln0-lni-real'],rect:['D2-eipi-ln0-lni-rect'],polar:['D2-eipi-ln0-lni-polar'],
 c:{real:'-1; undef; π/2·i (no warnings)',rect:'-1; undef; π/2·i',polar:'-1; undef; e^(iπ/2)·π/2'}},
{p:'Part 3 · imaginary unit',t:'i, 3+4i, i², i·i, (1+i)², 1/i',in:'i, 3+4i, i^2, i*i, (1+i)^2, 1/i',
 real:['D3-i-basic-real','D3-i-basic-real-b'],rect:['D3-i-basic-rect'],polar:['D3-i-basic-polar-a','D3-i-basic-polar-b'],
 c:{real:'i; 3+4i; -1; -1; 2i; -i',rect:'same as Real',polar:'e^(iπ/2); e^(i(π/2−tan⁻¹(3/4)))·5; -1; -1; e^(iπ/2)·2; e^(-iπ/2)'}},
{p:'Part 3 · imaginary unit',t:'abs, real, imag, conj, angle of 3+4i',in:'abs(3+4i), real(3+4i), imag(3+4i), conj(3+4i), angle(3+4i)',
 real:['D3-abs-real-imag-conj-angle-real'],rect:['D3-abs-real-imag-conj-angle-rect'],polar:['D3-abs-real-polar','D3-imag-conj-angle-polar'],
 c:{real:'5; 3; 4; 3−4i; π/2 − tan⁻¹(3/4)',rect:'same as Real',polar:'5; 3; 4; e^(i(2tan⁻¹(3/4)−π)/2)·5; π/2 − tan⁻¹(3/4)'}},
{p:'Part 3 · imaginary unit',t:'real/imag of 3+4√(-1); complex product and quotient',in:'real(3+4*sqrt(-1)), imag(3+4*sqrt(-1)), (3+4i)*(1-2i), (3+4i)/(1-2i)',
 real:['D3-real-imag-sqrt-and-products-real','D3-real-imag-sqrt-real-warning'],rect:['D3-real-imag-sqrt-and-products-rect'],polar:['D3-real-imag-sqrt-and-products-polar'],
 c:{real:'⚠ 3; ⚠ 4 (triangle = "Non-real calculation"); 11−2i; -1+2i',rect:'3; 4 (no triangle); 11−2i; -1+2i',polar:'3; 4; e^(-i·tan⁻¹(2/11))·5·√5; e^(i(tan⁻¹(1/2)+π/2))·√5'}},
{p:'Part 4 · solving',t:'solve, cSolve, zeros, cZeros, factor, cFactor',in:'solve(x^2+1=0,x), solve(x^2=-4,x), cSolve(x^2+1=0,x), cSolve(x^3=1,x), zeros/cZeros/factor/cFactor(x^2+1), solve(x^2+2x+5=0,x)',
 real:['D4-solve-cSolve-real-a','D4-solve-cSolve-real-b'],rect:['D4-solve-cSolve-rect-a','D4-zeros-factor-solve-rect-b'],polar:['D4-solve-cSolve-polar-a','D4-cSolve-polar-b','D4-factor-cFactor-solve-polar'],
 c:{real:'false; false; x=i or x=-i; 3 roots; zeros = empty list {▢}; {i,-i}; x²+1; (x−i)(x+i); false',rect:'identical to Real',polar:'false; false; x=e^(iπ/2) or e^(-iπ/2); e^(±2iπ/3), 1; zeros top row cut off (NOT confirmed); cZeros; x²+1; (x+e^(-iπ/2))(x+e^(iπ/2)); false'}},
{p:'Part 5 · display',t:'Negative reals',in:'-3, -√2, -1',
 real:['D5-negatives-real'],rect:['D5-negatives-rect'],polar:['D5-negatives-and-3plus4i-polar','D5-neg3-1plusi-polar'],
 c:{real:'-3; -√2; -1',rect:'-3; -√2; -1',polar:'-3 and -1 seen; -√2 cut off at top (NOT confirmed)'}},
{p:'Part 5 · display',t:'Complex results as displayed',in:'3+4i, -3, i, 1+i, -1-i, 2e^(iπ/3)',
 real:['D5-polar-inputs-real'],rect:['D5-polar-inputs-rect'],polar:['D5-polar-inputs-polar-b','D5-negatives-and-3plus4i-polar','D5-neg3-1plusi-polar'],
 c:{real:'3+4i; -3; i; 1+i; -1−i; 1+√3 i',rect:'same as Real',polar:'e^(i(π/2−tan⁻¹(3/4)))·5; -3; e^(iπ/2); e^(iπ/4)·√2; e^(-3iπ/4)·√2; e^(iπ/3)·2'}},
{p:'Part 5 · display',t:'Approximate (ctrl+Enter), list and matrix',in:'3+4i ctrl+Enter, 1+i ctrl+Enter, {1,sqrt(-1)}, [1,i;0,1]',
 real:['D5-approx-matrix-real','D5-list-sqrt-real-dialog'],rect:['D5-approx-list-matrix-rect'],polar:['D5-approx-list-matrix-polar','D5-approx-3plus4i-polar'],
 c:{real:'3.+4.·i; 1.+i; list → Error: Non-real result; matrix [[1,i],[0,1]]',rect:'3.+4.·i; 1.+i; {1,i}; [[1,i],[0,1]]',polar:'e^(0.92729522·i)·5.; e^(0.78539816·i)·1.4142136; {1,e^(iπ/2)}; [[1,e^(iπ/2)],[0,1]]'}},
{p:'Part 5 · display',t:'Polar with Angle = Degree',in:'3+4i, i, 3+4i ctrl+Enter (Degree)',
 real:[],rect:[],polar:['D5-degree-polar'],
 c:{real:'not run',rect:'not run',polar:'(5 ∠ 90−tan⁻¹(3/4)); (1 ∠ 90); (5. ∠ 53.130102). Title bar DEG.'}},
{p:'Part 6 · Approximate calculation mode',t:'sqrt(-4), ln(-1), (-8)^(1/3), 3+4i',in:'Calculation Mode = Approximate',
 real:['D6-approx-real'],rect:['D6-approx-rect'],polar:['D6-approx-polar'],
 c:{real:'Error; Error; -2.; 3.+4.·i',rect:'2.·i; 3.1415927·i; 1.+1.7320508·i; 3.+4.·i',polar:'e^(1.5707963·i)·2.; e^(1.5707963·i)·3.1415927; e^(1.0471976·i)·2.; e^(0.92729522·i)·5.'}},
{p:'Part 7 · other',t:'fMin, fMax, nSolve, solve with complex coefficient, √i',in:'fMin(x^2+1,x), fMax(x^2+1,x), nSolve(x^2+1=0,x), solve(x^2=i,x), sqrt(i)',
 real:['D7-fmin-fmax-nsolve-real','D7-solve-complex-sqrti-real'],rect:['D7-fmax-nsolve-solve-sqrti-rect'],polar:['D7-fmax-nsolve-solve-sqrti-polar'],
 c:{real:'x=0; x=-∞ or x=∞; "No solution found"; false; √2/2+√2/2·i (+ accidental (-8)^((1/3)·i) row)',rect:'fMin not seen; same as Real otherwise',polar:'fMin not seen; …; √i = e^(iπ/4)'}}
];
const KEY='domain-review-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const NAMES={real:'Real',rect:'Rectangular',polar:'Polar'};
const main=document.getElementById('main');let cur=0;
function id(i){return 'g'+i}
function render(){
 main.innerHTML='';let lastP='';
 G.forEach((g,i)=>{
  const f=document.getElementById('filter').value,s=(S[id(i)]||{}).s||'';
  if(f==='todo'&&s)return; if(['ok','bad','unsure'].includes(f)&&s!==f)return;
  if(g.p!==lastP){const h=document.createElement('div');h.className='part';h.textContent=g.p;main.appendChild(h);lastP=g.p}
  const c=document.createElement('div');c.className='card '+s+(i===cur?' cur':'');c.dataset.i=i;
  let h='<h3>'+g.t+'</h3><div class="inputs">'+g.in+'</div><div class="modes">';
  for(const m of ['real','rect','polar']){
    h+='<div class="mode"><h4>'+NAMES[m]+'</h4><div class="claim"><b>Recorded: </b>'+g.c[m]+'</div>';
    if(!g[m].length)h+='<div class="hint">no screenshot</div>';
    g[m].forEach(n=>{h+='<img loading="lazy" src="'+D+n+'.png" alt="'+n+'" onerror="this.outerHTML=\'<div class=missing>missing: '+n+'.png</div>\'"><div class="cap">'+n+'.png</div>'});
    h+='</div>';
  }
  h+='</div><div class="row"><span class="st">'+
   ['ok:OK','bad:Wrong','unsure:Unsure'].map(x=>{const[k,l]=x.split(':');return '<button data-k="'+k+'" class="'+k+(s===k?' on':'')+'">'+l+'</button>'}).join(' ')+
   '</span><textarea placeholder="Note (what the screenshot actually shows)…">'+((S[id(i)]||{}).n||'').replace(/</g,'&lt;')+'</textarea></div>';
  c.innerHTML=h;main.appendChild(c);
 });
 const done=G.filter((_,i)=>(S[id(i)]||{}).s).length,bad=G.filter((_,i)=>(S[id(i)]||{}).s==='bad').length;
 document.getElementById('prog').textContent=done+' / '+G.length+' reviewed · '+bad+' wrong';
}
function setS(i,k){const o=S[id(i)]||{};o.s=o.s===k?'':k;S[id(i)]=o;save();render()}
main.addEventListener('click',e=>{
 const c=e.target.closest('.card');if(!c)return;const i=+c.dataset.i;cur=i;
 if(e.target.matches('button[data-k]')){setS(i,e.target.dataset.k);return}
 if(e.target.tagName==='IMG'){const z=document.getElementById('zoom');z.querySelector('img').src=e.target.src;z.classList.add('on')}
});
main.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'){const i=+e.target.closest('.card').dataset.i;const o=S[id(i)]||{};o.n=e.target.value;S[id(i)]=o;save()}});
document.getElementById('zoom').onclick=()=>document.getElementById('zoom').classList.remove('on');
document.getElementById('filter').onchange=render;
document.getElementById('reset').onclick=()=>{if(confirm('Clear all marks and notes?')){S={};save();render()}};
function md(){let o='# Domain test review flags\n\n';G.forEach((g,i)=>{const r=S[id(i)]||{};if(r.s==='bad'||r.s==='unsure'||r.n){o+='## '+g.p+' — '+g.t+' ['+(r.s||'note')+']\n- Inputs: '+g.in+'\n'+(r.n?'- Note: '+r.n+'\n':'')+'\n'}});return o}
document.getElementById('exp').onclick=async()=>{const t=md();try{await navigator.clipboard.writeText(t);alert('Copied.')}catch(e){prompt('Copy:',t)}};
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='domain-review.json';a.click()};
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
 if(e.key==='Escape'){document.getElementById('zoom').classList.remove('on');return}
 const cards=[...document.querySelectorAll('.card')];if(!cards.length)return;
 let idx=cards.findIndex(c=>+c.dataset.i===cur);
 if(e.key==='j'||e.key==='k'){idx=Math.max(0,Math.min(cards.length-1,idx+(e.key==='j'?1:-1)));cur=+cards[idx].dataset.i;render();document.querySelector('.card.cur').scrollIntoView({block:'start',behavior:'smooth'})}
 if(e.key==='1')setS(cur,'ok');if(e.key==='2')setS(cur,'bad');if(e.key==='3')setS(cur,'unsure');
});
render();
</script></body></html>
