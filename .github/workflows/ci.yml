name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --group web
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest -m "not e2e" --cov=cassim --cov-branch --cov-report=json
      - run: uv run python -m tools.coverage_check
      - run: uv run python -m tools.traceability --check
      - run: uv run playwright install --with-deps chromium
      - run: >-
          uv run pytest -m e2e
          tests/e2e/test_pwa.py::test_cas_after_host_failure_and_offline
          tests/e2e/test_pwa.py::test_cached_navigation_offers_and_applies_update
