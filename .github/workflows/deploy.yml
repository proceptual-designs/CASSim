name: Deploy
# Cloudflare Pages projects (PLAN.md sections 14 and 15):
#   cassim-calc  testing: a push to main (one per batch merge) that changes the app, or a manual run
#   cassim-app   stable: a published GitHub release, or a manual run with target "stable"
#   cassim-tin   the Nspire alone (bundle tin), stable only: with cassim-app (decision 0032)
#   cassim-pseudo  Pseudocode & Python alone (bundle pseudo), stable only: with cassim-app
#   cassim-sci   the Scientific calculator alone (bundle sci), stable only: with cassim-app
#   cassim-wiki  help pages: a push to main that changes docs/wiki or its tool, or a manual run
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Which calculator site to deploy
        type: choice
        options: [testing, stable]
        default: testing

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER: npx --yes wrangler@4.160.1

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      site: ${{ steps.filter.outputs.site }}
      wiki: ${{ steps.filter.outputs.wiki }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        name: Decide which sites changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"; echo "wiki=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "$changed"
          site=false; wiki=false
          echo "$changed" | grep -qvE '^(docs/|tests/|corpus/|spikes/|\.github/|[^/]+\.md$|LICENSE$)' && site=true
          echo "$changed" | grep -qE '^(docs/wiki/|tools/wiki_site\.py)' && wiki=true
          echo "site=$site" >> "$GITHUB_OUTPUT"; echo "wiki=$wiki" >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: >-
      always() && (github.event_name != 'push' || needs.changes.outputs.site == 'true')
    runs-on: ubuntu-24.04
    concurrency:
      group: site-${{ (github.event_name == 'release' || inputs.target == 'stable') && 'stable' || 'testing' }}
      cancel-in-progress: true
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets"
            exit 1
          fi
      - id: target
        name: Choose the project
        run: |
          if [ "${{ github.event_name }}" = release ] || [ "${{ inputs.target }}" = stable ]; then
            echo "project=cassim-app" >> "$GITHUB_OUTPUT"
            echo "source=CASSim-app" >> "$GITHUB_OUTPUT"
          else
            echo "project=cassim-calc" >> "$GITHUB_OUTPUT"
            echo "source=CASSim-calc" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked --group web
      - run: uv run python -m tools.publish --bundle all --source ${{ steps.target.outputs.source }}
      - run: >-
          $WRANGLER pages deploy build/web --project-name ${{ steps.target.outputs.project }}
          --branch main --commit-hash ${{ github.sha }}
      # Single-device sites are stable only (PLAN.md section 15.1).
      - if: steps.target.outputs.project == 'cassim-app'
        run: uv run python -m tools.publish --bundle tin --source CASSim-TIN --dist build/tin
      - if: steps.target.outputs.project == 'cassim-app'
        run: >-
          $WRANGLER pages deploy build/tin --project-name cassim-tin
          --branch main --commit-hash ${{ github.sha }}
      - if: steps.target.outputs.project == 'cassim-app'
        run: uv run python -m tools.publish --bundle pseudo --source CASSim-pseudo --dist build/pseudo
      - if: steps.target.outputs.project == 'cassim-app'
        run: >-
          $WRANGLER pages deploy build/pseudo --project-name cassim-pseudo
          --branch main --commit-hash ${{ github.sha }}
      - if: steps.target.outputs.project == 'cassim-app'
        run: uv run python -m tools.publish --bundle sci --source CASSim-Sci --dist build/sci
      - if: steps.target.outputs.project == 'cassim-app'
        run: >-
          $WRANGLER pages deploy build/sci --project-name cassim-sci
          --branch main --commit-hash ${{ github.sha }}

  wiki:
    needs: changes
    if: >-
      always() && github.event_name != 'release'
      && (github.event_name != 'push' || needs.changes.outputs.wiki == 'true')
    runs-on: ubuntu-24.04
    concurrency:
      group: wiki
      cancel-in-progress: true
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync python -m tools.wiki_site
      - run: >-
          $WRANGLER pages deploy build/wiki --project-name cassim-wiki
          --branch main --commit-hash ${{ github.sha }}
